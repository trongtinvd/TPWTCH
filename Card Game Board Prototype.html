<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card Game Board Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{--bg:#14161c;--fg:#e8eaf0;--panel:rgba(20,22,28,.8)}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#dfe3ea;--fg:#1a1d24;--panel:rgba(255,255,255,.85)}}
  :root[data-theme="dark"]{--bg:#14161c;--fg:#e8eaf0;--panel:rgba(20,22,28,.8)}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  canvas{display:block;outline:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  #hud{position:fixed;left:234px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);padding:8px 12px;border-radius:8px;font-size:14px;pointer-events:none}
  #hud b{font-weight:600}
  #help{position:fixed;left:132px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);padding:6px 10px;border-radius:8px;font-size:12px;opacity:.85}

  .panel{position:fixed;background:var(--panel);border-radius:10px;font-size:13px;box-sizing:border-box;width:min(260px,48vw);overflow:auto;backdrop-filter:blur(6px)}
  .panel[hidden]{display:none}
  #deckPanel{right:12px;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100% - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  #inspect{left:234px;width:min(240px,40vw);top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100% - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 6px;position:sticky;top:0;background:var(--panel);z-index:1}
  .phead b{font-size:14px;font-weight:600}
  .xbtn{background:none;border:0;color:var(--fg);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px;opacity:.75}
  .xbtn:hover{opacity:1;background:rgba(128,128,128,.25)}
  .legend{--h:42;display:flex;align-items:center;gap:6px;padding:0 12px 8px;font-size:11px;opacity:.8}
  .legend i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,hsla(var(--h),90%,58%,.62),hsla(var(--h),90%,58%,.12))}
  .row{display:flex;align-items:center;gap:8px;margin:4px 8px;padding:7px 8px;border-radius:7px;border-left:6px solid var(--tc);cursor:pointer;color:var(--fg);outline:0;box-sizing:border-box}
  .row:hover,.row.sel{box-shadow:0 0 0 2px var(--fg) inset}
  .row .pos{min-width:20px;font-weight:700;font-size:12px;opacity:.85;text-align:right}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ty{font-size:10px;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
  .rowspace{height:8px}
  .art{height:140px;margin:0 12px 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;text-align:center;padding:8px;box-sizing:border-box;background:var(--tc)}
  .art img{height:100%;max-width:100%;object-fit:contain}
  .pbody{padding:0 12px 12px}
  .pbody h3{margin:0 0 2px;font-size:16px}
  .pbody .meta{opacity:.75;font-size:12px;margin-bottom:8px}
  .stats{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .stat{padding:3px 8px;border-radius:6px;background:rgba(128,128,128,.22);font-weight:600}
  .pbody p{margin:0 0 8px;line-height:1.4}
  .pbody .where{font-size:12px;opacity:.75}
  .pbody .dmg{font-size:12px;margin-top:8px;line-height:1.5}
  #status{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:var(--panel);padding:7px 14px;border-radius:8px;font-size:13px;pointer-events:none;max-width:min(440px,34vw);text-align:center}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin:0 12px 6px}
  .abtn{background:#3f7fd8;color:#fff;border:0;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .abtn:disabled{background:rgba(128,128,128,.35);color:var(--fg);opacity:.6;cursor:not-allowed}
  .note{margin:0 12px 10px;font-size:11px;opacity:.75}
  #menu{width:auto;min-width:140px;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.4)}
  #menu[hidden]{display:none}
  #menu .mt{font-size:12px;font-weight:600;opacity:.85}
  #hp{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:min(440px,34vw);background:var(--panel);padding:8px 10px;border-radius:10px;font-size:13px;display:flex;flex-direction:row;gap:14px;z-index:2;pointer-events:none;backdrop-filter:blur(6px);box-sizing:border-box}
  .hpr{flex:1;min-width:0;display:grid;grid-template-columns:52px 1fr 24px;align-items:center;gap:6px}
  .hpr .bar{height:10px;border-radius:5px;background:rgba(128,128,128,.3);overflow:hidden}
  .hpr .bar i{display:block;height:100%;width:100%;border-radius:5px;transition:width .35s}
  .hpr[data-p="Player"] i{background:#3f7fd8}
  .hpr[data-p="Opponent"] i{background:#d4524f}
  .hpr b{text-align:right;font-weight:700}
  #dbg{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;z-index:2}
  #dbg .abtn{padding:5px 10px;font-size:12px;text-align:left}
  #fn{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:3}
  .abtn.c-go:not(:disabled){background:#2f7d5b}
  .abtn.c-pass:not(:disabled){background:#a8742c}
  .abtn.c-atk:not(:disabled){background:#7a3b3b}
  .abtn.c-atk.on:not(:disabled){background:#c0392b}
  #viewBtn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2}
  #stack{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:210px;background:var(--panel);border-radius:10px;padding:8px;box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(6px);z-index:2}
  #stack.drop{box-shadow:0 0 0 3px #3fa66a}
  #stack .sh{font-size:12px;font-weight:700;opacity:.85}
  #stack .sc{width:85%;box-sizing:border-box;border-left:6px solid var(--tc);border-radius:7px;padding:6px 8px;background:rgba(128,128,128,.2);cursor:pointer;font-size:12px}
  #stack .sc.p{align-self:flex-start}                         /* your objects: left, 15% free space on the right */
  #stack .sc.o{align-self:flex-end;border-left:0;border-right:6px solid var(--tc);text-align:right}   /* opponent: right, 15% free on the left */
  #stack .sc.pend{visibility:hidden}                          /* hidden until its showcase animation lands */
  #stack .sc.top{box-shadow:0 0 0 2px var(--fg) inset}
  #stack .sc b{display:block;font-size:13px}
  #stack .sm{display:flex;justify-content:space-between;opacity:.85;margin-top:2px}
  @keyframes pg{0%,100%{box-shadow:0 0 0 2px #3fe07a,0 0 4px 1px rgba(63,224,122,.35)}50%{box-shadow:0 0 0 3px #3fe07a,0 0 16px 6px rgba(63,224,122,.85)}}
  .pulseG{animation:pg 1s ease-in-out infinite;border-radius:7px}
  #arrow{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:7}
  #reveal{position:fixed;left:486px;top:50%;transform:translateY(-50%);width:128px;padding:8px;border-radius:10px;background:var(--panel);border:3px solid var(--tc);text-align:center;font-size:12px;z-index:6;pointer-events:none;animation:pg 1s ease-in-out infinite}
  #reveal[hidden]{display:none}
  #reveal img{width:100%;height:96px;object-fit:contain}
  #reveal b{display:block;font-size:13px}
  .ghost{position:fixed;left:0;top:0;width:140px;height:196px;z-index:20;pointer-events:none;box-sizing:border-box;padding:8px;border-radius:12px;background:var(--panel);border:3px solid var(--tc);box-shadow:0 8px 26px rgba(0,0,0,.5);text-align:center;will-change:transform}
  .ghost img{width:100%;height:118px;object-fit:contain}
  .ghost b{display:block;font-size:14px;margin-top:4px}
  .ghost i{display:block;font-style:normal;font-size:11px;opacity:.8}
  #hp{pointer-events:auto}
  .hpr{cursor:default}
  .mv{display:flex}
  .xbtn:disabled{opacity:.2;cursor:default}
  #pick{left:50%;transform:translateX(-50%);top:calc(110px + env(safe-area-inset-top,0px));width:min(320px,60vw);padding:10px;display:flex;flex-direction:column;gap:6px;z-index:4;box-shadow:0 4px 18px rgba(0,0,0,.4)}
  #pick[hidden]{display:none}
  #pick .mt{font-size:12px;font-weight:600;opacity:.85}
</style>
</head>
<body>
<div id="hud"><b>Hover a zone</b></div>
<div id="status"></div>
<div id="menu" class="panel" hidden></div>
<div id="pick" class="panel" hidden></div>
<div id="deckPanel" class="panel" hidden></div>
<div id="inspect" class="panel" hidden></div>
<div id="hp">
  <div class="hpr" data-p="Player"><span>Player 1</span><div class="bar"><i></i></div><b>20</b></div>
  <div class="hpr" data-p="Opponent"><span>Player 2</span><div class="bar"><i></i></div><b>20</b></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// 01-scene.js - Three.js scene, camera, renderer, lights, table
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(3, 29, 22);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.maxPolarAngle = Math.PI/2 - 0.05;
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(6, 14, 8);
scene.add(sun);

const table = new THREE.Mesh(
  new THREE.BoxGeometry(21, 0.3, 25),
  new THREE.MeshStandardMaterial({color:0x353c4f, roughness:0.9})
);
table.position.set(0, -0.25, 0);
scene.add(table);
// Ground under each half: brightens while that player has priority (matches the board lift)
const GROUND_DIM = new THREE.Color(0x353c4f), GROUND_LIT = new THREE.Color(0x707c9c), pads = {};
for (const p of ['Player', 'Opponent']){
  const pad = new THREE.Mesh(new THREE.BoxGeometry(21, 0.02, 12.5), new THREE.MeshStandardMaterial({color:0x353c4f, roughness:0.9}));
  pad.position.set(0, -0.09, p === 'Player' ? 6.25 : -6.25);
  scene.add(pad); pads[p] = pad;
}

const zones = [];

const slotZones = {};
</script>
<script>
// 02-cards.js - Effect API (Fx) and card definitions
// ---- Placeholder cards -------------------------------------------------
const TYPES = {
  creature:    {label:'Creature',    color:'#3f7fd8'},
  enchantment: {label:'Enchantment', color:'#3fa66a'},
  spell:       {label:'Spell',       color:'#d4524f'}
};
TYPES.ability = {label:'Ability', color:'#b8892b'};
const cardColor = def => def.type === 'spell' && def.timing === 'Slow' ? '#8e5bd0' : TYPES[def.type].color;   // Slow spells are purple
// =====================================================================
// EFFECT API (content side). Cards may ONLY use these builders; each returns plain
// data naming an operation the Sim publishes (see Sim.API). Mix and match freely.
// =====================================================================
const Fx = {
  // effects (run when a spell/ability resolves)
  dealDamage: (to, amount) => ({op:'DealDamage', to, amount}),   // to: 'player' | 'target'
  gainLife: amount => ({op:'GainLife', amount}),
  draw: n => ({op:'Draw', n}),
  damageStack: amount => ({op:'DamageStack', amount}),
  sacrificeSelf: () => ({op:'SacrificeSelf'}),                   // also usable as a cost
  repeat: (n, ...effects) => ({op:'Repeat', n, effects}),        // composition: run effects n times
  // costs (paid on activation)
  payLife: n => ({op:'PayLife', n}),
  exileFromGY: n => ({op:'ExileFromGY', n}),
  exileSelf: () => ({op:'ExileSelf'}),                           // cost: exile this card from the graveyard
  shiftAdjacent: () => ({op:'ShiftAdjacent'}),
  damageAnother: amount => ({op:'DamageAnother', amount}),       // effect: controller picks another creature; it takes `amount` effect damage
  removeDamage: n => ({op:'RemoveDamage', n}),                   // effect: remove n damage points from the target; controller picks which instances                   // effect: controller may move this card to an adjacent empty column
  nearestZone: skip => ({op:'NearestZone', skip}),                // effect: pick the closest zone to this card, skipping zones occupied by 'self' / a card id
  destroyOnZone: () => ({op:'DestroyOnZone'}),                    // effect: destroy whatever stands on the picked zone
  createToken: token => ({op:'CreateToken', token}),              // effect: create def.tokens[token] on the picked zone, under the controller
  trigger: {                                                     // triggered abilities: go on the stack when the event happens
    enter: (...effects) => ({on:'enter', effects}),
    damaged: (...effects) => ({on:'damaged', effects}),          // this card takes combat damage
    turnStart: (...effects) => ({on:'turnStart', effects}),     // start of its controller's turn              // when this card enters the field
    attack: (by, ...effects) => ({on:'attack', by, effects})     // by: 'self' and/or 'foe' (creature controlled by this card's opponent)
  },
  // requirements (strings) and targets (strings)
  req: {front:'front', hurt:'hurt', target:'target', stack:'stack'},
  target: {opposingFront:'opposingFront'},
  zoneTarget: {anyPermanent:'anyPermanent'},                     // spell target: a zone with a card (or a cloud) on it, chosen when the spell is played
  rider: {inheritAbilities: () => ({op:'InheritAbilities'})},    // damage this card deals: the victim loses its abilities and gains this card's,
  colTarget: {full:'fullColumn'},                                // spell target: a column (chosen when the spell is played)
  obscure: () => ({op:'Obscure'}),                               // passive: a black cloud covers each of the controller's other zones
  exileColumn: () => ({op:'ExileColumn'}),                       // effect: exile every card on the targeted column
  makeColumnUnusable: () => ({op:'MakeColumnUnusable'}),         // effect: the targeted column's four zones become unusable for the rest of the game
  returnToHand: () => ({op:'ReturnToHand'})                      // effect: this spell goes to its owner's hand instead of the graveyard
};
// Each card is an independent module: a factory that receives the API and returns its definition.
const Cards = {list: [], add(factory){ this.list.push(factory(Fx)); }};
const PHC = 'Placeholder creature. No ability yet.', PHE = 'Placeholder enchantment. No effect yet.';
Cards.add(() => ({id:'soldier', name:'Soldier', type:'creature', atk:2, hp:3, text:PHC}));
Cards.add(() => ({id:'knight',  name:'Knight',  type:'creature', atk:4, hp:5, text:PHC}));
Cards.add(() => ({id:'giant',   name:'Giant',   type:'creature', atk:6, hp:8, text:PHC}));
Cards.add(() => ({id:'barrier', name:'Barrier', type:'enchantment', hp:2, text:PHE}));
Cards.add(Fx => ({id:'ward', name:'Ward', type:'enchantment', hp:4, text:'Fast. You have lost life: sacrifice this card, then gain 3 life. (Stack HP 2)',
  abilities:[{name:'Restore', speed:'Fast', req:[Fx.req.hurt], hp:2, effects:[Fx.gainLife(3), Fx.sacrificeSelf()]}]}));
Cards.add(() => ({id:'aura', name:'Aura', type:'enchantment', hp:6, text:PHE}));
Cards.add(Fx => ({id:'heal', name:'Heal', type:'spell', timing:'Quick', hp:3, text:'Quick. Gain 3 life.', effects:[Fx.gainLife(3)]}));
Cards.add(Fx => ({id:'zap', name:'Zap', type:'spell', timing:'Quick', hp:0, text:'Quick, 0 HP (still resolves). Deal 1 damage to the opponent.', effects:[Fx.dealDamage('player', 1)]}));
Cards.add(Fx => ({id:'archer', name:'Archer', type:'creature', atk:3, hp:2, text:'Slow. Front row: pay 1 life; deal 2 damage to the opponent. (Stack HP 1)',
  abilities:[{name:'Volley', speed:'Slow', req:[Fx.req.front], cost:[Fx.payLife(1)], hp:1, effects:[Fx.dealDamage('player', 2)]}]}));
Cards.add(() => ({id:'guard', name:'Guard', type:'creature', atk:1, hp:6, text:PHC}));
Cards.add(() => ({id:'wolf',  name:'Wolf',  type:'creature', atk:3, hp:3, text:PHC}));
Cards.add(Fx => ({id:'scout', name:'Scout', type:'creature', atk:1, hp:1, text:'Fast. A creature faces this: sacrifice this card; deal 3 damage to that creature. (Stack HP 0)',
  abilities:[{name:'Ambush', speed:'Fast', req:[Fx.req.target], cost:[Fx.sacrificeSelf()], target:Fx.target.opposingFront, hp:0, effects:[Fx.dealDamage('target', 3)]}]}));
Cards.add(() => ({id:'banner', name:'Banner', type:'enchantment', hp:3, text:PHE}));
Cards.add(() => ({id:'trap',   name:'Trap',   type:'enchantment', hp:1, text:PHE}));
Cards.add(Fx => ({id:'charm', name:'Charm', type:'enchantment', hp:5, text:'Slow. Exile your oldest GY card; draw 1. (Stack HP 1)',
  abilities:[{name:'Recall', speed:'Slow', cost:[Fx.exileFromGY(1)], hp:1, effects:[Fx.draw(1)]}]}));
Cards.add(Fx => ({id:'infinitywall', name:'Infinity Wall', type:'spell', timing:'Quick', hp:6, colTarget:Fx.colTarget.full,
  text:'Quick. Target a fully filled column: exile every card on it. That column becomes unusable for the rest of the game. Return this card to your hand. (Stack HP 6)',
  effects:[Fx.exileColumn(), Fx.makeColumnUnusable(), Fx.returnToHand()]}));
Cards.add(Fx => ({id:'bolt', name:'Bolt', type:'spell', timing:'Quick', hp:2, req:[Fx.req.stack], text:'Quick. Deal 3 damage to the stack object beneath it (countered at HP -1 or lower).', effects:[Fx.damageStack(3)]}));
Cards.add(() => ({id:'mend',     name:'Mend',     type:'spell', timing:'Quick', hp:4, text:'Placeholder Quick spell. No effect yet.'}));
Cards.add(() => ({id:'fireball', name:'Fireball', type:'spell', timing:'Slow',  hp:6, text:'Placeholder Slow spell. No effect yet.'}));
Cards.add(() => ({id:'rally',    name:'Rally',    type:'spell', timing:'Slow',  hp:1, text:'Placeholder Slow spell. No effect yet.'}));
Cards.add(() => ({id:'blast',    name:'Blast',    type:'spell', timing:'Slow',  hp:5, text:'Placeholder Slow spell: only when the stack is empty. No effect yet.'}));
Cards.add(Fx => ({id:'hummingbird', name:'Red Hummingbird', type:'creature', atk:2, hp:1,
  text:'When this enters: draw a card. When this card or an opponent\u2019s creature attacks: you may shift this card to an adjacent empty column. Fast, from your GY: exile this card; gain 3 life.',
  triggers:[Fx.trigger.enter(Fx.draw(1)), Fx.trigger.attack(['self', 'foe'], Fx.shiftAdjacent())],
  abilities:[{name:'Feather Balm', speed:'Fast', zone:'gy', req:[Fx.req.hurt], cost:[Fx.exileSelf()], hp:1, effects:[Fx.gainLife(3)]}]}));
Cards.add(Fx => ({id:'kingeye', name:'King Eye', type:'creature', atk:6, hp:10,
  text:'Passive. A black cloud covers each of your other zones: your opponent cannot see those zones or the cards on them. A cloud is a legal target for anything that targets a card or zone there; the effect passes to what is underneath, and with nothing legal underneath it fizzles.',
  passives:[Fx.obscure()]}));
Cards.add(Fx => { const spread = Fx.repeat(4, Fx.nearestZone(['self', 'vine-token']), Fx.destroyOnZone(), Fx.createToken('vine'));
  return {id:'vine', name:'The Vine', type:'creature', atk:1, hp:1,
    text:'When this enters and at the start of your turn: 4 times, pick the closest zone not occupied by this card or a Vine token, destroy the card there, and create a Vine token (1/1) on it.',
    tokens:{vine:{id:'vine-token', name:'Vine', type:'creature', atk:1, hp:1, text:'Token. Vanilla 1/1.'}},
    triggers:[Fx.trigger.enter(spread), Fx.trigger.turnStart(spread)]}; });
Cards.add(Fx => ({id:'avatar', name:'Avatar of Rabies', type:'creature', atk:3, hp:7,
  text:'Whenever a creature attacks: you may shift this card to an adjacent empty column. Whenever this card takes combat damage: deal 1 damage to another creature. Damage dealt by this card: that creature loses all its original abilities and gains the abilities of Avatar of Rabies.',
  triggers:[Fx.trigger.attack(['any'], Fx.shiftAdjacent()), Fx.trigger.damaged(Fx.damageAnother(1))],
  rider:Fx.rider.inheritAbilities()}));
Cards.add(Fx => ({id:'bandages', name:'Throwing Bandages', type:'spell', timing:'Quick', hp:10, zoneTarget:Fx.zoneTarget.anyPermanent,
  text:'Quick. Target a permanent: remove 7 damage counters from it (7 points, split across its damage instances as you choose). (Stack HP 10)',
  effects:[Fx.removeDamage(7)]}));
const DEFS = Cards.list;
</script>
<script>
// 03-sim.js - Simulation: rules, stack, combat, effects, API validation (no THREE, no DOM)
// =====================================================================
// SIMULATION: plain serialisable data + pure functions. No THREE, no DOM,
// no view/camera concepts. Commands in, events out. Runs headless.
// =====================================================================
const deepFreeze = o => { if (o && typeof o === 'object' && !Object.isFrozen(o)){ Object.values(o).forEach(deepFreeze); Object.freeze(o); } return o; };
deepFreeze(DEFS); deepFreeze(TYPES);                // CardDefinitions are immutable design data
const Sim = (function(){
  const other = p => p === 'Player' ? 'Opponent' : 'Player';
  let byId = {};                                      // def id -> definition (filled by create)
  const abDef = c => c.xform ? byId[c.xform] : c.def;   // ability layer: effective abilities/triggers/rider. c.def is never edited
  const isPerm = c => c.def.type !== 'spell' && c.def.type !== 'ability';

    Sim.dispatch(q, {type:'Pass', player:'Opponent'});

    const r = start(41); take(r, 'Opponent', 'barrier', 'board', 'Opponent|back|2'); take(r, 'Opponent', 'guard', 'board', 'Opponent|front|2'); take(r, 'Player', 'aura', 'board', 'Player|back|2');
    const wl = take(r, 'Opponent', 'infinitywall', 'hand'), kn = take(r, 'Player', 'knight', 'hand');
    Sim.dispatch(r, {type:'PlayCard', iid:kn.iid, slot:'Player|front|2'});
    check('the opponent can play Infinity Wall in the window after the 4th card is placed', !Sim.canPlay(r, wl));
    Sim.dispatch(r, {type:'PlayCard', iid:wl.iid, col:2}); Sim.dispatch(r, {type:'Pass', player:'Player'}); Sim.dispatch(r, {type:'Pass', player:'Opponent'});
    check('the response resolves: column exiled and unusable, wall back in the opponent\u2019s hand', kn.loc === 'exile' && r.unusable['Player|front|2'] && wl.loc === 'hand');
    check('the window stays open after the response', !!r.respond && r.priority === 'Opponent');
    const b = start(42), bt = take(b, 'Player', 'bolt', 'hand'), zp = take(b, 'Opponent', 'zap', 'hand');
    check('Bolt cannot be played with nothing on the stack', !!Sim.canPlay(b, bt));
    Sim.dispatch(b, {type:'PlayCard', iid:bt.iid});
    check('a failed Bolt play changes nothing', bt.loc === 'hand');
    const z2 = take(b, 'Player', 'zap', 'hand'), bo = take(b, 'Opponent', 'bolt', 'hand'); Sim.dispatch(b, {type:'PlayCard', iid:z2.iid});
    check('Bolt can be played once there is an object on the stack', !Sim.canPlay(b, bo));
  }
  {                                                 // King Eye clouds + Infinity Wall
    const q = start(40); take(q, 'Player', 'soldier', 'board', 'Player|front|0'); take(q, 'Player', 'barrier', 'board', 'Player|back|0'); const kw = take(q, 'Player', 'infinitywall', 'hand');
    check('column 1 with 2 cards of mine and none of the opponent: Wall cannot be played', !!Sim.canPlay(q, kw));
    take(q, 'Opponent', 'kingeye', 'board', 'Opponent|front|1');
    check('King Eye clouds act as legal targets: Wall is playable on column 1', Sim.canPlay(q, kw) === null && Sim.targetColumns(q, kw).join() === '0');
    check('clouds never cover King Eye\u2019s own zone', !Sim.cloudMap(q)['Opponent|front|1'] && !!Sim.cloudMap(q)['Opponent|front|0']);
    const k1 = Sim.dispatch(q, {type:'PlayCard', iid:kw.iid, col:0}); Sim.dispatch(q, {type:'Pass', player:'Opponent'}); const k2 = Sim.dispatch(q, {type:'Pass', player:'Player'});
    check('Wall fizzles when nothing legal is underneath the clouds, and the column is revealed', k1.ok && kw.loc === 'gy' && !q.unusable['Player|front|0'] && k2.events.some(e => e.t === 'StackObjectFizzled' && e.revealCol === 0));
    const q2 = start(41); take(q2, 'Player', 'wolf', 'board', 'Player|front|2'); take(q2, 'Player', 'barrier', 'board', 'Player|back|2'); take(q2, 'Opponent', 'trap', 'board', 'Opponent|back|2'); take(q2, 'Opponent', 'kingeye', 'board', 'Opponent|front|1'); const kw2 = take(q2, 'Player', 'infinitywall', 'hand');
    Sim.dispatch(q2, {type:'PlayCard', iid:kw2.iid, col:2}); Sim.dispatch(q2, {type:'Pass', player:'Opponent'}); const k3 = Sim.dispatch(q2, {type:'Pass', player:'Player'});
    check('with one real card under the clouds the Wall also fizzles (column not really full)', kw2.loc === 'gy' && !q2.unusable['Player|front|2'] && k3.events.some(e => e.revealCol === 2));
    const q3 = start(42); take(q3, 'Opponent', 'kingeye', 'board', 'Opponent|front|1'); const ke = Object.values(q3.cards).find(x => x.def.id === 'kingeye' && x.loc === 'board'); ke.loc = 'gy'; ke.slot = null; q3.slots['Opponent|front|1'] = null;
    check('clouds vanish when King Eye leaves the board', !Object.keys(Sim.cloudMap(q3)).length);
  }
  console.log(out.join('\n')); return out;
}
window.cardGame = {Sim, send, undo, eventLog, history:undoStack, selfTest, get game(){ return sim; }};   // console/testing hook
setTopView(true);                                   // default camera: top view
sync(); openDeckEditor();
(function loop(){                                   // idle = no rendering, no raycasts
  requestAnimationFrame(loop);
  const busy = animate(); controls.update();
  if (hoverDirty && !drag){ hoverDirty = false; updateHover(); }
  const now = performance.now();
  if (busy || dirty || (pulse && now - lastPulse > 33)){ dirty = false; lastPulse = now; renderer.render(scene, cam); }
})();

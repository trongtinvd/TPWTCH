<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card Game Board Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{--bg:#14161c;--fg:#e8eaf0;--panel:rgba(20,22,28,.8)}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#dfe3ea;--fg:#1a1d24;--panel:rgba(255,255,255,.85)}}
  :root[data-theme="dark"]{--bg:#14161c;--fg:#e8eaf0;--panel:rgba(20,22,28,.8)}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  canvas{z-index:0;position:fixed;left:0;top:var(--vt,0px);width:100%;height:var(--vh,100%);display:block;outline:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  #hud{position:fixed;left:234px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);padding:8px 12px;border-radius:8px;font-size:14px;pointer-events:none}
  #hud b{font-weight:600}
  #help{position:fixed;left:132px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);padding:6px 10px;border-radius:8px;font-size:12px;opacity:.85}

  .panel{position:fixed;background:var(--panel);border-radius:10px;font-size:13px;box-sizing:border-box;width:min(260px,48vw);overflow:auto;backdrop-filter:blur(6px)}
  .panel[hidden]{display:none}
  #deckPanel{right:12px;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100% - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  #inspect{left:234px;width:min(240px,40vw);top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100% - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 6px;position:sticky;top:0;background:var(--panel);z-index:1}
  .phead b{font-size:14px;font-weight:600}
  .xbtn{background:none;border:0;color:var(--fg);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px;opacity:.75}
  .xbtn:hover{opacity:1;background:rgba(128,128,128,.25)}
  .legend{--h:42;display:flex;align-items:center;gap:6px;padding:0 12px 8px;font-size:11px;opacity:.8}
  .legend i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,hsla(var(--h),90%,58%,.62),hsla(var(--h),90%,58%,.12))}
  .row{display:flex;align-items:center;gap:8px;margin:4px 8px;padding:7px 8px;border-radius:7px;border-left:6px solid var(--tc);cursor:pointer;color:var(--fg);outline:0;box-sizing:border-box}
  .row:hover,.row.sel{box-shadow:0 0 0 2px var(--fg) inset}
  .row .pos{min-width:20px;font-weight:700;font-size:12px;opacity:.85;text-align:right}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ty{font-size:10px;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
  .rowspace{height:8px}
  .art{height:140px;margin:0 12px 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;text-align:center;padding:8px;box-sizing:border-box;background:var(--tc)}
  .art img{height:100%;max-width:100%;object-fit:contain}
  .pbody{padding:0 12px 12px}
  .pbody h3{margin:0 0 2px;font-size:16px}
  .pbody .meta{opacity:.75;font-size:12px;margin-bottom:8px}
  .stats{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .stat{padding:3px 8px;border-radius:6px;background:rgba(128,128,128,.22);font-weight:600}
  .pbody p{margin:0 0 8px;line-height:1.4}
  .pbody .where{font-size:12px;opacity:.75}
  .pbody .dmg{font-size:12px;margin-top:8px;line-height:1.5}
  #status{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:var(--panel);padding:7px 14px;border-radius:8px;font-size:13px;pointer-events:none;max-width:min(440px,34vw);text-align:center}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin:0 12px 6px}
  .abtn{background:#3f7fd8;color:#fff;border:0;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .abtn:disabled{background:rgba(128,128,128,.35);color:var(--fg);opacity:.6;cursor:not-allowed}
  .note{margin:0 12px 10px;font-size:11px;opacity:.75}
  #menu{width:auto;min-width:140px;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.4)}
  #menu[hidden]{display:none}
  #menu .mt{font-size:12px;font-weight:600;opacity:.85}
  #hp{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:min(440px,34vw);background:var(--panel);padding:8px 10px;border-radius:10px;font-size:13px;display:flex;flex-direction:row;gap:14px;z-index:2;pointer-events:none;backdrop-filter:blur(6px);box-sizing:border-box}
  .hpr{flex:1;min-width:0;display:grid;grid-template-columns:52px 1fr 24px;align-items:center;gap:6px}
  .hpr .bar{height:10px;border-radius:5px;background:rgba(128,128,128,.3);overflow:hidden}
  .hpr .bar i{display:block;height:100%;width:100%;border-radius:5px;transition:width .35s}
  .hpr[data-p="Player"] i{background:#3f7fd8}
  .hpr[data-p="Opponent"] i{background:#d4524f}
  .hpr b{text-align:right;font-weight:700}
  #dbg{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;z-index:2}
  #dbg .abtn{padding:5px 10px;font-size:12px;text-align:left}
  #fn{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:3}
  .abtn.c-go:not(:disabled){background:#2f7d5b}
  .abtn.c-pass:not(:disabled){background:#a8742c}
  .abtn.c-atk:not(:disabled){background:#7a3b3b}
  .abtn.c-atk.on:not(:disabled){background:#c0392b}
  #viewBtn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2}
  #stack{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:210px;background:var(--panel);border-radius:10px;padding:8px;box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(6px);z-index:2}
  #stack.drop{box-shadow:0 0 0 3px #3fa66a}
  #stack .sh{font-size:12px;font-weight:700;opacity:.85}
  #stack .sc{width:85%;box-sizing:border-box;border-left:6px solid var(--tc);border-radius:7px;padding:6px 8px;background:rgba(128,128,128,.2);cursor:pointer;font-size:12px}
  #stack .sc.p{align-self:flex-start}                         /* your objects: left, 15% free space on the right */
  #stack .sc.o{align-self:flex-end;border-left:0;border-right:6px solid var(--tc);text-align:right}   /* opponent: right, 15% free on the left */
  #stack .sc.pend{visibility:hidden}                          /* hidden until its showcase animation lands */
  #stack .sc.top{box-shadow:0 0 0 2px var(--fg) inset}
  #stack .sc b{display:block;font-size:13px}
  #stack .sm{display:flex;justify-content:space-between;opacity:.85;margin-top:2px}
  @keyframes pg{0%,100%{box-shadow:0 0 0 2px #3fe07a,0 0 4px 1px rgba(63,224,122,.35)}50%{box-shadow:0 0 0 3px #3fe07a,0 0 16px 6px rgba(63,224,122,.85)}}
  .pulseG{animation:pg 1s ease-in-out infinite;border-radius:7px}
  #arrow{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:7}
  #reveal{position:fixed;left:486px;top:50%;transform:translateY(-50%);width:128px;padding:8px;border-radius:10px;background:var(--panel);border:3px solid var(--tc);text-align:center;font-size:12px;z-index:6;pointer-events:none;animation:pg 1s ease-in-out infinite}
  #reveal[hidden]{display:none}
  #reveal img{width:100%;height:96px;object-fit:contain}
  #reveal b{display:block;font-size:13px}
  .ghost{position:fixed;left:0;top:0;width:140px;height:196px;z-index:20;pointer-events:none;box-sizing:border-box;padding:8px;border-radius:12px;background:var(--panel);border:3px solid var(--tc);box-shadow:0 8px 26px rgba(0,0,0,.5);text-align:center;will-change:transform}
  .ghost img{width:100%;height:118px;object-fit:contain}
  .ghost b{display:block;font-size:14px;margin-top:4px}
  .ghost i{display:block;font-style:normal;font-size:11px;opacity:.8}
  #hp{pointer-events:auto}
  .hpr{cursor:default}
  .mv{display:flex}
  .xbtn:disabled{opacity:.2;cursor:default}
  #pick{left:50%;transform:translateX(-50%);top:calc(110px + env(safe-area-inset-top,0px));width:min(320px,60vw);padding:10px;display:flex;flex-direction:column;gap:6px;z-index:4;box-shadow:0 4px 18px rgba(0,0,0,.4)}
  #pick[hidden]{display:none}
  #pick .mt{font-size:12px;font-weight:600;opacity:.85}

  #hud,#status,#help,#deckPanel,#inspect{z-index:1}
  .hpr{position:relative}
  .hpr.tgt{animation:pg 1s ease-in-out infinite;border-radius:7px;cursor:pointer}
  .splat{position:absolute;left:34%;top:-7px;width:46px;height:24px;pointer-events:none;border-radius:55% 45% 60% 40%;background:#b3121c;transform:rotate(-8deg);box-shadow:16px 7px 0 -4px #b3121c,-14px 5px 0 -5px #b3121c,26px -3px 0 -8px #b3121c}
  #banner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;padding:14px 30px;font-size:28px;font-weight:700;background:var(--panel);border-radius:12px;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.45)}
  #banner[hidden]{display:none}
  /* ---- Portrait: card inspector on top, board in the middle, stack (left) + GY / Exile / Deck lists (right) at the bottom ---- */
  @media (orientation: portrait){
    :root{--topH:26dvh;--botH:28dvh;--vt:var(--topH);--vh:calc(100dvh - var(--topH) - var(--botH))}
    #hud,#help{display:none}
    #inspect{left:8px;right:8px;width:auto;top:calc(8px + env(safe-area-inset-top,0px));height:calc(var(--topH) - 12px - env(safe-area-inset-top,0px));max-height:none;display:grid;grid-template-columns:min(34%,150px) 1fr;grid-auto-rows:min-content;column-gap:8px;align-content:start}
    #inspect:not([hidden]){display:grid}
    #inspect .phead,#inspect .acts,#inspect .note{grid-column:1/-1}
    #inspect .art{height:min(100px,calc(var(--topH) - 70px));margin:0 0 6px 10px}
    #inspect .pbody{padding:0 10px 10px 0}
    #hp{top:calc(var(--topH) + 4px);left:8px;right:8px;transform:none;width:auto}
    #fn{top:calc(var(--topH) + 46px);right:auto;left:8px;max-width:calc(100% - 96px);flex-wrap:wrap}
    #fn .abtn{padding:5px 9px;font-size:12px}
    #viewBtn{left:auto;right:8px;bottom:auto;top:calc(var(--topH) + 46px)}
    #status{left:8px;right:8px;transform:none;max-width:none;top:auto;bottom:calc(var(--botH) + 6px);font-size:12px;padding:5px 10px}
    #stack{left:8px;right:auto;top:calc(100dvh - var(--botH) + 4px);bottom:calc(8px + env(safe-area-inset-bottom,0px));width:calc(50% - 12px)}
    #deckPanel{left:calc(50% + 4px);right:8px;width:auto;top:calc(100dvh - var(--botH) + 4px);bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:none;z-index:3}
    #dbg{left:8px;right:8px;bottom:calc(var(--botH) + 40px);flex-direction:row;flex-wrap:wrap;justify-content:flex-start}
    #dbg .abtn{padding:4px 8px;font-size:11px}
    #reveal{left:auto;right:8px}
  }
</style>
</head>
<body>
<div id="hud"><b>Hover a zone</b></div>
<div id="status"></div>
<div id="menu" class="panel" hidden></div>
<div id="pick" class="panel" hidden></div>
<div id="deckPanel" class="panel" hidden></div>
<div id="inspect" class="panel" hidden></div>
<div id="hp">
  <div class="hpr" data-p="Player"><span>Player 1</span><div class="bar"><i></i></div><b>20</b></div>
  <div class="hpr" data-p="Opponent"><span>Player 2</span><div class="bar"><i></i></div><b>20</b></div>
</div>
<div id="stack"></div><button id="viewBtn" class="abtn">Top view</button><div id="help"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// 01-scene.js - Three.js scene, camera, renderer, lights, table
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);
const VW = () => (renderer.domElement.clientWidth || innerWidth), VH = () => (renderer.domElement.clientHeight || innerHeight), VX = () => renderer.domElement.getBoundingClientRect().left, VY = () => renderer.domElement.getBoundingClientRect().top;   // the canvas may be a sub-rectangle of the window (portrait)
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(3, 29, 22);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);   // CSS sizes the canvas
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.maxPolarAngle = Math.PI/2 - 0.05;
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(6, 14, 8);
scene.add(sun);

const table = new THREE.Mesh(
  new THREE.BoxGeometry(21, 0.3, 25),
  new THREE.MeshStandardMaterial({color:0x353c4f, roughness:0.9})
);
table.position.set(0, -0.25, 0);
scene.add(table);
// Ground under each half: brightens while that player has priority (matches the board lift)
const GROUND_DIM = new THREE.Color(0x353c4f), GROUND_LIT = new THREE.Color(0x707c9c), pads = {};
for (const p of ['Player', 'Opponent']){
  const pad = new THREE.Mesh(new THREE.BoxGeometry(21, 0.02, 12.5), new THREE.MeshStandardMaterial({color:0x353c4f, roughness:0.9}));
  pad.position.set(0, -0.09, p === 'Player' ? 6.25 : -6.25);
  scene.add(pad); pads[p] = pad;
}

const zones = [];

const slotZones = {};
</script>
<script>
// 02-cards.js - Effect API (Fx) and card definitions
// ---- Placeholder cards -------------------------------------------------
const TYPES = {
  creature:    {label:'Creature',    color:'#3f7fd8'},
  enchantment: {label:'Enchantment', color:'#3fa66a'},
  spell:       {label:'Spell',       color:'#d4524f'}
};
TYPES.ability = {label:'Ability', color:'#b8892b'};
const cardColor = def => def.type === 'spell' && def.timing === 'Slow' ? '#8e5bd0' : TYPES[def.type].color;   // Slow spells are purple
// =====================================================================
// EFFECT API (content side). Cards may ONLY use these builders; each returns plain
// data naming an operation the Sim publishes (see Sim.API). Mix and match freely.
// =====================================================================
const Fx = {
  // effects (run when a spell/ability resolves)
  dealDamage: (to, amount) => ({op:'DealDamage', to, amount}),   // to: 'player' | 'target'
  gainLife: amount => ({op:'GainLife', amount}),
  draw: n => ({op:'Draw', n}),
  damageStack: amount => ({op:'DamageStack', amount}),
  sacrificeSelf: () => ({op:'SacrificeSelf'}),                   // also usable as a cost
  repeat: (n, ...effects) => ({op:'Repeat', n, effects}),        // composition: run effects n times
  // costs (paid on activation)
  payLife: n => ({op:'PayLife', n}),
  exileFromGY: n => ({op:'ExileFromGY', n}),
  exileSelf: () => ({op:'ExileSelf'}),                           // cost: exile this card from the graveyard
  shiftAdjacent: () => ({op:'ShiftAdjacent'}),
  damageAnother: amount => ({op:'DamageAnother', amount}),       // effect: controller picks another creature; it takes `amount` effect damage
  removeDamage: n => ({op:'RemoveDamage', n}),                   // effect: remove n damage points from the target; controller picks which instances                   // effect: controller may move this card to an adjacent empty column
  mill: n => ({op:'Mill', n}),                                   // effect: target player puts n cards from the top of their deck into the GY
  fetch: card => ({op:'FetchFromDeck', card}),                   // effect: controller adds the named card from their deck to their hand
  doublePower: () => ({op:'DoublePower'}),                       // effect: this card's power x2 (Base layer, lasts while on the field)
  nearestZone: skip => ({op:'NearestZone', skip}),                // effect: pick the closest zone to this card, skipping zones occupied by 'self' / a card id
  destroyOnZone: () => ({op:'DestroyOnZone'}),                    // effect: destroy whatever stands on the picked zone
  createToken: token => ({op:'CreateToken', token}),              // effect: create def.tokens[token] on the picked zone, under the controller
  trigger: {                                                     // triggered abilities: go on the stack when the event happens
    enter: (...effects) => ({on:'enter', effects}),
    combat: (...effects) => ({on:'combat', effects}),            // beginning of its controller's combat step
    damaged: (...effects) => ({on:'damaged', effects}),          // this card takes combat damage
    turnStart: (...effects) => ({on:'turnStart', effects}),     // start of its controller's turn              // when this card enters the field
    attack: (by, ...effects) => ({on:'attack', by, effects})     // by: 'self' and/or 'foe' (creature controlled by this card's opponent)
  },
  // requirements (strings) and targets (strings)
  req: {front:'front', hurt:'hurt', target:'target', stack:'stack'},
  target: {opposingFront:'opposingFront'},
  zoneTarget: {anyPermanent:'anyPermanent'},
  playerTarget: true,                                            // spell flag: a player can be targeted (click a life bar)                     // spell target: a zone with a card (or a cloud) on it, chosen when the spell is played
  rider: {inheritAbilities: () => ({op:'InheritAbilities'})},    // damage this card deals: the victim loses its abilities and gains this card's,
  colTarget: {full:'fullColumn'},                                // spell target: a column (chosen when the spell is played)
  obscure: () => ({op:'Obscure'}),                               // passive: a black cloud covers each of the controller's other zones
  exileColumn: () => ({op:'ExileColumn'}),                       // effect: exile every card on the targeted column
  makeColumnUnusable: () => ({op:'MakeColumnUnusable'}),         // effect: the targeted column's four zones become unusable for the rest of the game
  returnToHand: () => ({op:'ReturnToHand'})                      // effect: this spell goes to its owner's hand instead of the graveyard
};
// Each card is an independent module: a factory that receives the API and returns its definition.
const Cards = {list: [], add(factory){ this.list.push(factory(Fx)); }};
const FIXTURES = [];   // ability-less cards kept ONLY for headless tests; not part of the game's card pool
const PHC = 'Placeholder creature. No ability yet.', PHE = 'Placeholder enchantment. No effect yet.';
FIXTURES.push({id:'soldier', name:'Soldier', type:'creature', atk:2, hp:3, text:PHC});
FIXTURES.push({id:'knight',  name:'Knight',  type:'creature', atk:4, hp:5, text:PHC});
FIXTURES.push({id:'giant',   name:'Giant',   type:'creature', atk:6, hp:8, text:PHC});
FIXTURES.push({id:'barrier', name:'Barrier', type:'enchantment', hp:2, text:PHE});
Cards.add(Fx => ({id:'ward', name:'Ward', type:'enchantment', hp:4, text:'Fast. You have lost life: sacrifice this card, then gain 3 life. (Stack HP 2)',
  abilities:[{name:'Restore', speed:'Fast', req:[Fx.req.hurt], hp:2, effects:[Fx.gainLife(3), Fx.sacrificeSelf()]}]}));
FIXTURES.push({id:'aura', name:'Aura', type:'enchantment', hp:6, text:PHE});
Cards.add(Fx => ({id:'heal', name:'Heal', type:'spell', timing:'Quick', hp:3, text:'Quick. Gain 3 life.', effects:[Fx.gainLife(3)]}));
Cards.add(Fx => ({id:'zap', name:'Zap', type:'spell', timing:'Quick', hp:0, text:'Quick, 0 HP (still resolves). Deal 1 damage to the opponent.', effects:[Fx.dealDamage('player', 1)]}));
Cards.add(Fx => ({id:'archer', name:'Archer', type:'creature', atk:3, hp:2, text:'Slow. Front row: pay 1 life; deal 2 damage to the opponent. (Stack HP 1)',
  abilities:[{name:'Volley', speed:'Slow', req:[Fx.req.front], cost:[Fx.payLife(1)], hp:1, effects:[Fx.dealDamage('player', 2)]}]}));
FIXTURES.push({id:'guard', name:'Guard', type:'creature', atk:1, hp:6, text:PHC});
FIXTURES.push({id:'wolf',  name:'Wolf',  type:'creature', atk:3, hp:3, text:PHC});
Cards.add(Fx => ({id:'scout', name:'Scout', type:'creature', atk:1, hp:1, text:'Fast. A creature faces this: sacrifice this card; deal 3 damage to that creature. (Stack HP 0)',
  abilities:[{name:'Ambush', speed:'Fast', req:[Fx.req.target], cost:[Fx.sacrificeSelf()], target:Fx.target.opposingFront, hp:0, effects:[Fx.dealDamage('target', 3)]}]}));
FIXTURES.push({id:'banner', name:'Banner', type:'enchantment', hp:3, text:PHE});
FIXTURES.push({id:'trap',   name:'Trap',   type:'enchantment', hp:1, text:PHE});
Cards.add(Fx => ({id:'charm', name:'Charm', type:'enchantment', hp:5, text:'Slow. Exile your oldest GY card; draw 1. (Stack HP 1)',
  abilities:[{name:'Recall', speed:'Slow', cost:[Fx.exileFromGY(1)], hp:1, effects:[Fx.draw(1)]}]}));
Cards.add(Fx => ({id:'infinitywall', name:'Infinity Wall', type:'spell', timing:'Quick', hp:6, colTarget:Fx.colTarget.full,
  text:'Quick. Target a fully filled column: exile every card on it. That column becomes unusable for the rest of the game. Return this card to your hand. (Stack HP 6)',
  effects:[Fx.exileColumn(), Fx.makeColumnUnusable(), Fx.returnToHand()]}));
Cards.add(Fx => ({id:'bolt', name:'Bolt', type:'spell', timing:'Quick', hp:2, req:[Fx.req.stack], text:'Quick. Deal 3 damage to the stack object beneath it (countered at HP -1 or lower).', effects:[Fx.damageStack(3)]}));
FIXTURES.push({id:'mend',     name:'Mend',     type:'spell', timing:'Quick', hp:4, text:'Placeholder Quick spell. No effect yet.'});

function labelTexture(title, sub, w, d){
  const c = document.createElement('canvas');
  const S = 128;                              // pixels per world unit
  c.width = Math.round(S*w*0.96); c.height = Math.round(S*d*0.96);
  const g = c.getContext('2d');
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const maxW = c.width * 0.88;
  // shrink font until the text fits inside the zone
  function fit(text, weight, size){
    for (; size > 8; size--){
      g.font = weight + ' ' + size + 'px sans-serif';
      if (g.measureText(text).width <= maxW) break;
    }
    return size;
  }
  const tSize = fit(title, 'bold', 52);
  g.fillStyle = 'rgba(255,255,255,0.92)';
  g.font = 'bold ' + tSize + 'px sans-serif';
  g.fillText(title, c.width/2, sub ? c.height/2 - tSize*0.3 : c.height/2);
  if (sub){
    const sSize = fit(sub, 'normal', Math.round(tSize*0.7));
    g.font = sSize + 'px sans-serif';
    g.fillStyle = 'rgba(255,255,255,0.6)';
    g.fillText(sub, c.width/2, c.height/2 + tSize*0.6);
  }

  tex.anisotropy = 8;
  return tex;
}

function makeZone(name, label, w, d, color, x, z, sub, rot){
  rot = rot || 0;   // text rotation in radians, seen from above
  const mat = new THREE.MeshStandardMaterial({color, roughness:0.7, emissive:0x000000});
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, d), mat);
  mesh.position.set(x, 0, z);

  scene.add(mesh);

    new THREE.MeshBasicMaterial({map: labelTexture(label, sub, tw, td), transparent:true})
  );
  plane.rotation.x = -Math.PI/2;
  plane.rotation.z = rot;

    check('clouds never cover King Eye\u2019s own zone', !Sim.cloudMap(q)['Opponent|front|1'] && !!Sim.cloudMap(q)['Opponent|front|0']);
    const k1 = Sim.dispatch(q, {type:'PlayCard', iid:kw.iid, col:0}); Sim.dispatch(q, {type:'Pass', player:'Opponent'}); const k2 = Sim.dispatch(q, {type:'Pass', player:'Player'});
    check('Wall fizzles when nothing legal is underneath the clouds, and nothing is revealed', k1.ok && kw.loc === 'gy' && !q.unusable['Player|front|0'] && k2.events.some(e => e.t === 'StackObjectFizzled' ));
    const q2 = start(41); take(q2, 'Player', 'wolf', 'board', 'Player|front|2'); take(q2, 'Player', 'barrier', 'board', 'Player|back|2'); take(q2, 'Opponent', 'trap', 'board', 'Opponent|back|2'); take(q2, 'Opponent', 'kingeye', 'board', 'Opponent|front|1'); const kw2 = take(q2, 'Player', 'infinitywall', 'hand');
    Sim.dispatch(q2, {type:'PlayCard', iid:kw2.iid, col:2}); Sim.dispatch(q2, {type:'Pass', player:'Opponent'}); const k3 = Sim.dispatch(q2, {type:'Pass', player:'Player'});
    check('with one real card under the clouds the Wall also fizzles (column not really full)', kw2.loc === 'gy' && !q2.unusable['Player|front|2'] && k3.events.some(e => e.t === 'StackObjectFizzled'));
    const q3 = start(42); take(q3, 'Opponent', 'kingeye', 'board', 'Opponent|front|1'); const ke = Object.values(q3.cards).find(x => x.def.id === 'kingeye' && x.loc === 'board'); ke.loc = 'gy'; ke.slot = null; q3.slots['Opponent|front|1'] = null;
    check('clouds vanish when King Eye leaves the board', !Object.keys(Sim.cloudMap(q3)).length);
  }
  { const q = start(110), ke = take(q, 'Opponent', 'kingeye', 'board', 'Opponent|front|1'), sb = take(q, 'Player', 'superbolt', 'hand');
    D(q, {type:'PlayCard', iid:sb.iid, zone:'Opponent|back|4'}); const r = pass2(q);
    eq('Superbolt on an empty zone under a cloud fizzles and reveals nothing', [r.events.some(e => e.t === 'StackObjectFizzled'), ke.damage.length, q.life.Opponent, sb.loc], [true, 0, 20, 'gy']);
    const p = start(111), sb2 = take(p, 'Player', 'superbolt', 'hand');
    rej('without clouds an empty zone is not a legal Superbolt target', p, {type:'PlayCard', iid:sb2.iid, zone:'Opponent|back|4'}, 'Illegal target zone'); }
  { const drain2 = drain; let q = start(120), z = take(q, 'Player', 'superbolt', 'hand'); D(q, {type:'PlayCard', iid:z.iid, tplayer:'Opponent'}); drain2(q);
    eq('Superbolt deals exactly 20 to a player (20 -> 0); the game does not end by itself (no win rule implemented)', [q.life.Opponent, q.phase], [0, 'play']);
    q = start(121); z = take(q, 'Player', 'superbolt', 'hand'); const vt = take(q, 'Opponent', 'scout', 'board', 'Opponent|front|1'); D(q, {type:'PlayCard', iid:z.iid, zone:'Opponent|front|1'}); drain2(q);
    eq('Superbolt on a permanent destroys it and leaves players\u2019 life alone', [vt.loc, q.life.Opponent, q.life.Player], ['gy', 20, 20]);
    q = start(122); z = take(q, 'Player', 'grainfall', 'hand'); const od = q.piles.Opponent.deck.map(c => c.iid), pd = q.piles.Player.deck.length;
    rej('GrainFall needs a player target', q, {type:'PlayCard', iid:z.iid}, 'Target a player');
    D(q, {type:'PlayCard', iid:z.iid, tplayer:'Opponent'}); drain2(q);
    eq('GrainFall: the top ten cards go to the GY (newest first), the rest stay in order; the caster\u2019s deck is untouched', [q.piles.Opponent.gy.map(c => c.iid), q.piles.Opponent.deck.map(c => c.iid), q.piles.Player.deck.length], [od.slice(0, 10).reverse(), od.slice(10), pd]);
    q = start(123); z = take(q, 'Player', 'grainfall', 'hand'); q.piles.Opponent.deck.splice(3); D(q, {type:'PlayCard', iid:z.iid, tplayer:'Opponent'}); drain2(q);
    eq('GrainFall with fewer than 10 cards mills what exists, no error', [q.piles.Opponent.deck.length, q.piles.Opponent.gy.length], [0, 3]);
    q = start(124); z = take(q, 'Player', 'grainfall', 'hand'); const pd2 = q.piles.Player.deck.length; D(q, {type:'PlayCard', iid:z.iid, tplayer:'Player'}); drain2(q);
    eq('GrainFall may target its own caster', [q.piles.Player.deck.length, q.piles.Player.gy.length - 1], [pd2 - 10, 10]); }

  // ================= Black Hawk, Bolt Master =================
  { let q = start(130); const hk = take(q, 'Player', 'blackhawk', 'board', 'Player|front|0'); D(q, {type:'SetAttackPhase', player:'Player', on:true});
    eq('Black Hawk: combat-step trigger is on the stack, power not doubled yet, non-turn player has priority', [q.stack.length, hk.atk, q.priority], [1, 1, 'Opponent']);
    rej('no attack until the combat trigger has resolved', q, {type:'Attack', iid:hk.iid}, 'Stack is not empty');
    drain(q); eq('power doubled 5 times: 1 x 2^5 = 32', hk.atk, 32);
    D(q, {type:'Attack', iid:hk.iid}); eq('Black Hawk deals its doubled power (32) to the player through an empty column', q.life.Opponent, 20 - 32);
    q = start(131); const oh = take(q, 'Opponent', 'blackhawk', 'board', 'Opponent|front|0'); D(q, {type:'SetAttackPhase', player:'Player', on:true});
    eq('an opposing Black Hawk does not trigger in my combat step', [q.stack.length, oh.atk], [0, 1]);
    q = start(132); const bm = take(q, 'Player', 'boltmaster', 'hand'), sb = toDeck(q, 'Player', 'superbolt'), h0 = q.piles.Player.hand.length;
    D(q, {type:'PlayCard', iid:bm.iid, slot:'Player|front|2'}); drain(q);
    check('Bolt Master fetches Superbolt from the deck into the hand (hand: -Bolt Master +Superbolt)', sb.loc === 'hand' && !q.piles.Player.deck.includes(sb) && q.piles.Player.hand.length === h0);
    q = start(133); const bm2 = take(q, 'Player', 'boltmaster', 'hand'); take(q, 'Player', 'superbolt', 'gy'); const h1 = q.piles.Player.hand.length, d1 = q.piles.Player.deck.length;
    D(q, {type:'PlayCard', iid:bm2.iid, slot:'Player|front|2'}); drain(q);
    eq('Bolt Master with no Superbolt in the deck: fetches nothing, no error (a Superbolt in the GY is not fetched)', [q.piles.Player.hand.length, q.piles.Player.deck.length, q.piles.Player.hand.some(c => c.def.id === 'superbolt')], [h1 - 1, d1, false]); }

  // ================= The Vine =================
  { let s = start(140); const vn = take(s, 'Player', 'vine', 'hand'), sd = take(s, 'Opponent', 'soldier', 'board', 'Opponent|front|2');
    D(s, {type:'PlayCard', iid:vn.iid, slot:'Player|front|2'}); drain(s);
    check('Vine enter: one token on each of the 4 nearest zones (any row), owned by the Vine\u2019s controller', tokens(s).length === 4 && tokens(s).every(t => t.owner === 'Player') && ['Player|front|1', 'Player|front|3', 'Player|back|2', 'Opponent|front|2'].every(k => s.slots[k] && s.cards[s.slots[k]].def.id === 'vine-token'));
    check('Vine destroys the card on the zone it picks; the Vine itself stays put', sd.loc === 'gy' && vn.loc === 'board' && vn.slot === 'Player|front|2');
    endTurnFlow(s); check('Vine: no trigger at the OPPONENT\u2019s turn start', s.active === 'Opponent' && !s.stack.length);
    endTurnFlow(s); check('Vine: trigger goes on the stack at its controller\u2019s turn start', s.active === 'Player' && s.stack.length === 1);
    pass2(s); check('Vine turn-start: 4 more tokens (8 total), never on the Vine or an existing token', tokens(s).length === 8 && vn.slot === 'Player|front|2' && vn.loc === 'board');
    s = start(141); const v2 = take(s, 'Player', 'vine', 'hand'); for (const k of Object.keys(s.slots)) if (k !== 'Player|front|0') s.unusable[k] = true;
    D(s, {type:'PlayCard', iid:v2.iid, slot:'Player|front|0'}); drain(s);
    eq('Vine with no legal zone (every other zone unusable): nothing is created, nothing destroyed', [tokens(s).length, s.piles.Player.gy.length, v2.loc], [0, 0, 'board']);
    s = start(142); const v3 = take(s, 'Player', 'vine', 'hand'); for (const k of Object.keys(s.slots)) if (k !== 'Player|front|0' && k !== 'Opponent|back|4') s.unusable[k] = true;
    D(s, {type:'PlayCard', iid:v3.iid, slot:'Player|front|0'}); drain(s);
    eq('with exactly one legal zone the 4 repetitions create just one token there (re-evaluated each time)', [tokens(s).length, tokens(s)[0] && tokens(s)[0].slot], [1, 'Opponent|back|4']);
    s = start(143); take(s, 'Player', 'vine', 'board', 'Player|front|0'); const fillers = [];
    for (const k of Object.keys(s.slots)) if (!s.slots[k]){ const f = {iid:'fx-' + k, def:FIXTURES.find(d => d.id === 'soldier'), owner:'Opponent', loc:'board', slot:k, damage:[], atk:2}; s.cards[f.iid] = f; s.slots[k] = f.iid; fillers.push(f); }   // 19 DISTINCT filler cards (take() would reuse one card)
    endTurnFlow(s); endTurnFlow(s); drain(s);
    eq('Vine on a full board: the 4 nearest non-Vine zones are converted: 4 fillers destroyed, 4 tokens, 15 fillers untouched', [tokens(s).length, fillers.filter(f => f.loc === 'gy').length, fillers.filter(f => f.loc === 'board').length], [4, 4, 15]); }
  { const VT = DEFS.find(d => d.id === 'vine').tokens.vine; let s = start(144); const vz = take(s, 'Player', 'knight', 'board', 'Player|front|1'), tk = take(s, 'Player', 'soldier', 'board', 'Opponent|front|1');
    tk.def = VT; tk.atk = undefined; tk.token = true; s.attackPhase = true; D(s, {type:'Attack', iid:tk.iid});
    eq('a token standing on the foe\u2019s front row hits the foe (1), not its own side', [s.life.Opponent, s.life.Player, vz.damage.length], [19, 20, 0]);
    s = start(145); const tb = take(s, 'Player', 'soldier', 'board', 'Opponent|front|1'), ob = take(s, 'Opponent', 'knight', 'board', 'Opponent|back|1'); tb.def = VT; tb.token = true; s.attackPhase = true; D(s, {type:'Attack', iid:tb.iid});
    eq('...and damages the foe\u2019s back card in its column, not the player', [ob.damage.length, s.life.Opponent], [1, 20]);
    s = start(146); const av = take(s, 'Player', 'vine', 'board', 'Player|front|1'), ally = take(s, 'Player', 'soldier', 'board', 'Opponent|front|1'); ally.def = VT; ally.token = true; s.attackPhase = true; D(s, {type:'Attack', iid:av.iid});
    eq('your own Vine in the foe\u2019s column does not absorb your attack', [ally.damage.length, ally.loc, s.life.Opponent], [0, 'board', 19]); }

  // ================= combat is a phase; Avatar dying to its own trigger =================
  { let s = start(160); const a = take(s, 'Player', 'wolf', 'board', 'Player|front|0'), b = take(s, 'Player', 'knight', 'board', 'Player|front|1'); D(s, {type:'SetAttackPhase', player:'Player', on:true});
    D(s, {type:'Attack', iid:a.iid}); const r = D(s, {type:'Attack', iid:b.iid});
    eq('combat is a phase: several creatures attack one at a time in the same turn (wolf 3 + knight 4)', [r.ok, s.life.Opponent, s.attacked, s.attackPhase], [true, 13, [a.iid, b.iid], true]);
    rej('...but each creature attacks only once per phase', s, {type:'Attack', iid:a.iid}, 'Already attacked');
    s = start(161); const av = take(s, 'Opponent', 'avatar', 'board', 'Opponent|front|1'), g = take(s, 'Player', 'giant', 'board', 'Player|front|1'); av.damage = [{amount:5, source:g.iid, type:'combat', turn:1, seq:99}]; s.attackPhase = true;
    D(s, {type:'Attack', iid:g.iid}); pass2(s); D(s, {type:'Choose', player:'Opponent', option:'stay'});
    check('Avatar destroyed by the damage that triggers it: its trigger is already on the stack', av.loc === 'gy' && s.stack.length === 1 && s.life.Opponent === 16);
    pass2(s);
    eq('current rule: the trigger still resolves after Avatar died (1 effect damage from Avatar to the other creature)', g.damage.map(d => [d.amount, d.type, d.source]), [[1, 'effect', av.iid]]); }
  // ================= turn structure, life boundaries =================
  { let s = start(150); const wf = take(s, 'Player', 'wolf', 'board', 'Player|front|0'); D(s, {type:'SetAttackPhase', player:'Player', on:true}); D(s, {type:'Attack', iid:wf.iid});
    rej('EndTurn by the non-turn player', s, {type:'EndTurn', player:'Opponent'}, 'turn player');
    D(s, {type:'EndTurn', player:'Player'});
    eq('EndTurn opens the end-step window; the turn has not changed yet', [s.respond && s.respond.kind, s.active, s.turn, s.priority], ['end', 'Player', 1, 'Opponent']);
    rej('EndTurn cannot be repeated while the window is open', s, {type:'EndTurn', player:'Player'}, 'priority');
    D(s, {type:'Pass', player:'Opponent'});
    eq('passing in the window ends the turn and resets per-turn state', [s.active, s.turn, s.attackPhase, s.majorUsed, s.attacked.length, s.priority, s.respond], ['Opponent', 2, false, false, 0, 'Opponent', null]);
    check('the new turn player can take a major action', D(s, {type:'Draw', player:'Opponent'}).ok);
    s = start(151); const z = take(s, 'Player', 'zap', 'hand'); D(s, {type:'PlayCard', iid:z.iid}); D(s, {type:'Pass', player:'Opponent'});
    rej('EndTurn with a non-empty stack is rejected', s, {type:'EndTurn', player:'Player'}, 'Stack is not empty');
    s = start(152); const he = take(s, 'Player', 'heal', 'hand'); D(s, {type:'PlayCard', iid:he.iid}); pass2(s);
    check('life can go above the starting value (no cap): 20 + 3 = 23', s.life.Player === 23);
    s = start(153); s.life.Opponent = 5; const sb = take(s, 'Player', 'superbolt', 'hand'); D(s, {type:'PlayCard', iid:sb.iid, tplayer:'Opponent'}); pass2(s);
    check('life can go below zero: 5 - 20 = -15', s.life.Opponent === -15); }
  out.push('---- ' + out.filter(l => l.startsWith('PASS')).length + ' passed, ' + out.filter(l => l.startsWith('FAIL')).length + ' failed, ' + out.filter(l => l.startsWith('XFAIL')).length + ' known bug(s) documented');
  console.log(out.join('\n')); return out;
}
window.cardGame = {Sim, send, undo, eventLog, history:undoStack, selfTest, get game(){ return sim; }};   // console/testing hook
setTopView(true);                                   // default camera: top view
sync(); openDeckEditor();
(function loop(){                                   // idle = no rendering, no raycasts
  requestAnimationFrame(loop);
  const busy = animate(); controls.update();
  if (hoverDirty && !drag){ hoverDirty = false; updateHover(); }
  const now = performance.now();
  if (busy || dirty || (pulse && now - lastPulse > 33)){ dirty = false; lastPulse = now; renderer.render(scene, cam); }
})();

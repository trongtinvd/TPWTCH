<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card Game Board Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{--bg:#14161c;--fg:#e8eaf0;--panel:rgba(20,22,28,.8)}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#dfe3ea;--fg:#1a1d24;--panel:rgba(255,255,255,.85)}}
  :root[data-theme="dark"]{--bg:#14161c;--fg:#e8eaf0;--panel:rgba(20,22,28,.8)}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  canvas{display:block;outline:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  #hud{position:fixed;left:174px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);padding:8px 12px;border-radius:8px;font-size:14px;pointer-events:none}
  #hud b{font-weight:600}
  #help{position:fixed;left:132px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);padding:6px 10px;border-radius:8px;font-size:12px;opacity:.85}

  .panel{position:fixed;background:var(--panel);border-radius:10px;font-size:13px;box-sizing:border-box;width:min(260px,48vw);overflow:auto;backdrop-filter:blur(6px)}
  .panel[hidden]{display:none}
  #deckPanel{right:12px;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100% - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  #inspect{left:234px;width:min(240px,40vw);top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100% - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 6px;position:sticky;top:0;background:var(--panel);z-index:1}
  .phead b{font-size:14px;font-weight:600}
  .xbtn{background:none;border:0;color:var(--fg);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px;opacity:.75}
  .xbtn:hover{opacity:1;background:rgba(128,128,128,.25)}
  .legend{--h:42;display:flex;align-items:center;gap:6px;padding:0 12px 8px;font-size:11px;opacity:.8}
  .legend i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,hsla(var(--h),90%,58%,.62),hsla(var(--h),90%,58%,.12))}
  .row{display:flex;align-items:center;gap:8px;margin:4px 8px;padding:7px 8px;border-radius:7px;border-left:6px solid var(--tc);cursor:pointer;color:var(--fg);outline:0;box-sizing:border-box}
  .row:hover,.row.sel{box-shadow:0 0 0 2px var(--fg) inset}
  .row .pos{min-width:20px;font-weight:700;font-size:12px;opacity:.85;text-align:right}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ty{font-size:10px;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
  .rowspace{height:8px}
  .art{height:140px;margin:0 12px 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;text-align:center;padding:8px;box-sizing:border-box;background:var(--tc)}
  .art img{height:100%;max-width:100%;object-fit:contain}
  .pbody{padding:0 12px 12px}
  .pbody h3{margin:0 0 2px;font-size:16px}
  .pbody .meta{opacity:.75;font-size:12px;margin-bottom:8px}
  .stats{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .stat{padding:3px 8px;border-radius:6px;background:rgba(128,128,128,.22);font-weight:600}
  .pbody p{margin:0 0 8px;line-height:1.4}
  .pbody .where{font-size:12px;opacity:.75}
  .pbody .dmg{font-size:12px;margin-top:8px;line-height:1.5}
  #status{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:var(--panel);padding:7px 14px;border-radius:8px;font-size:13px;pointer-events:none;max-width:min(440px,34vw);text-align:center}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin:0 12px 6px}
  .abtn{background:#3f7fd8;color:#fff;border:0;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .abtn:disabled{background:rgba(128,128,128,.35);color:var(--fg);opacity:.6;cursor:not-allowed}
  .note{margin:0 12px 10px;font-size:11px;opacity:.75}
  #menu{width:auto;min-width:140px;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.4)}
  #menu[hidden]{display:none}
  #menu .mt{font-size:12px;font-weight:600;opacity:.85}
  #hp{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:min(440px,34vw);background:var(--panel);padding:8px 10px;border-radius:10px;font-size:13px;display:flex;flex-direction:row;gap:14px;z-index:2;pointer-events:none;backdrop-filter:blur(6px);box-sizing:border-box}
  .hpr{flex:1;min-width:0;display:grid;grid-template-columns:52px 1fr 24px;align-items:center;gap:6px}
  .hpr .bar{height:10px;border-radius:5px;background:rgba(128,128,128,.3);overflow:hidden}
  .hpr .bar i{display:block;height:100%;width:100%;border-radius:5px;transition:width .35s}
  .hpr[data-p="Player"] i{background:#3f7fd8}
  .hpr[data-p="Opponent"] i{background:#d4524f}
  .hpr b{text-align:right;font-weight:700}
  #dbg{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;z-index:2}
  #dbg .abtn{padding:5px 10px;font-size:12px;text-align:left}
  #fn{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:3}
  .abtn.c-go:not(:disabled){background:#2f7d5b}
  .abtn.c-pass:not(:disabled){background:#a8742c}
  .abtn.c-atk:not(:disabled){background:#7a3b3b}
  .abtn.c-atk.on:not(:disabled){background:#c0392b}
  #viewBtn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2}
  #stack{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:210px;background:var(--panel);border-radius:10px;padding:8px;box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(6px);z-index:2}
  #stack.drop{box-shadow:0 0 0 3px #3fa66a}
  #stack .sh{font-size:12px;font-weight:700;opacity:.85}
  #stack .sc{width:85%;box-sizing:border-box;border-left:6px solid var(--tc);border-radius:7px;padding:6px 8px;background:rgba(128,128,128,.2);cursor:pointer;font-size:12px}
  #stack .sc.p{align-self:flex-start}                         /* your objects: left, 15% free space on the right */
  #stack .sc.o{align-self:flex-end;border-left:0;border-right:6px solid var(--tc);text-align:right}   /* opponent: right, 15% free on the left */
  #stack .sc.pend{visibility:hidden}                          /* hidden until its showcase animation lands */
  #stack .sc.top{box-shadow:0 0 0 2px var(--fg) inset}
  #stack .sc b{display:block;font-size:13px}
  #stack .sm{display:flex;justify-content:space-between;opacity:.85;margin-top:2px}
  @keyframes pg{0%,100%{box-shadow:0 0 0 2px #3fe07a,0 0 4px 1px rgba(63,224,122,.35)}50%{box-shadow:0 0 0 3px #3fe07a,0 0 16px 6px rgba(63,224,122,.85)}}
  .pulseG{animation:pg 1s ease-in-out infinite;border-radius:7px}
  #arrow{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:7}
  #reveal{position:fixed;left:486px;top:50%;transform:translateY(-50%);width:128px;padding:8px;border-radius:10px;background:var(--panel);border:3px solid var(--tc);text-align:center;font-size:12px;z-index:6;pointer-events:none;animation:pg 1s ease-in-out infinite}
  #reveal[hidden]{display:none}
  #reveal img{width:100%;height:96px;object-fit:contain}
  #reveal b{display:block;font-size:13px}
  .ghost{position:fixed;left:0;top:0;width:140px;height:196px;z-index:20;pointer-events:none;box-sizing:border-box;padding:8px;border-radius:12px;background:var(--panel);border:3px solid var(--tc);box-shadow:0 8px 26px rgba(0,0,0,.5);text-align:center;will-change:transform}
  .ghost img{width:100%;height:118px;object-fit:contain}
  .ghost b{display:block;font-size:14px;margin-top:4px}
  .ghost i{display:block;font-style:normal;font-size:11px;opacity:.8}
  #hp{pointer-events:auto}
  .hpr{cursor:default}
  .mv{display:flex}
  .xbtn:disabled{opacity:.2;cursor:default}
</style>
</head>
<body>
<div id="hud"><b>Hover a zone</b></div>
<div id="status"></div>
<div id="menu" class="panel" hidden></div>
<div id="deckPanel" class="panel" hidden></div>
<div id="inspect" class="panel" hidden></div>
<div id="hp">
  <div class="hpr" data-p="Player"><span>Player 1</span><div class="bar"><i></i></div><b>20</b></div>
  <div class="hpr" data-p="Opponent"><span>Player 2</span><div class="bar"><i></i></div><b>20</b></div>
</div>
<div id="stack"></div><button id="viewBtn" class="abtn">Top view</button><div id="help"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14161c);
  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
  camera.position.set(3, 29, 22);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.maxPolarAngle = Math.PI/2 - 0.05;
  controls.update();

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6);
  sun.position.set(6, 14, 8);
  scene.add(sun);

  const table = new THREE.Mesh(
    new THREE.BoxGeometry(21, 0.3, 25),
    new THREE.MeshStandardMaterial({color:0x353c4f, roughness:0.9})
  );
  table.position.set(0, -0.25, 0);
  scene.add(table);
  // Ground under each half: brightens while that player has priority (matches the board lift)
  const GROUND_DIM = new THREE.Color(0x353c4f), GROUND_LIT = new THREE.Color(0x707c9c), pads = {};
  for (const p of ['Player', 'Opponent']){
    const pad = new THREE.Mesh(new THREE.BoxGeometry(21, 0.02, 12.5), new THREE.MeshStandardMaterial({color:0x353c4f, roughness:0.9}));
    pad.position.set(0, -0.09, p === 'Player' ? 6.25 : -6.25);
    scene.add(pad); pads[p] = pad;
  }

  const zones = [];

  const slotZones = {};
  // ---- Placeholder cards -------------------------------------------------
  const TYPES = {
    creature:    {label:'Creature',    color:'#3f7fd8'},
    enchantment: {label:'Enchantment', color:'#3fa66a'},
    spell:       {label:'Spell',       color:'#d4524f'}
  };
  TYPES.ability = {label:'Ability', color:'#b8892b'};
  const cardColor = def => def.type === 'spell' && def.timing === 'Slow' ? '#8e5bd0' : TYPES[def.type].color;   // Slow spells are purple
  // =====================================================================
  // EFFECT API (content side). Cards may ONLY use these builders; each returns plain
  // data naming an operation the Sim publishes (see Sim.API). Mix and match freely.
  // =====================================================================
  const Fx = {
    // effects (run when a spell/ability resolves)
    dealDamage: (to, amount) => ({op:'DealDamage', to, amount}),   // to: 'player' | 'target'
    gainLife: amount => ({op:'GainLife', amount}),
    draw: n => ({op:'Draw', n}),
    damageStack: amount => ({op:'DamageStack', amount}),
    sacrificeSelf: () => ({op:'SacrificeSelf'}),                   // also usable as a cost
    repeat: (n, ...effects) => ({op:'Repeat', n, effects}),        // composition: run effects n times
    // costs (paid on activation)
    payLife: n => ({op:'PayLife', n}),
    exileFromGY: n => ({op:'ExileFromGY', n}),
    exileSelf: () => ({op:'ExileSelf'}),                           // cost: exile this card from the graveyard
    shiftAdjacent: () => ({op:'ShiftAdjacent'}),                   // effect: controller may move this card to an adjacent empty column
    nearestZone: skip => ({op:'NearestZone', skip}),                // effect: pick the closest zone to this card, skipping zones occupied by 'self' / a card id
    destroyOnZone: () => ({op:'DestroyOnZone'}),                    // effect: destroy whatever stands on the picked zone
    createToken: token => ({op:'CreateToken', token}),              // effect: create def.tokens[token] on the picked zone, under the controller
    trigger: {                                                     // triggered abilities: go on the stack when the event happens
      enter: (...effects) => ({on:'enter', effects}),
      turnStart: (...effects) => ({on:'turnStart', effects}),     // start of its controller's turn              // when this card enters the field
      attack: (by, ...effects) => ({on:'attack', by, effects})     // by: 'self' and/or 'foe' (creature controlled by this card's opponent)
    },
    // requirements (strings) and targets (strings)
    req: {front:'front', hurt:'hurt', target:'target'},
    target: {opposingFront:'opposingFront'}
  };
  // Each card is an independent module: a factory that receives the API and returns its definition.
  const Cards = {list: [], add(factory){ this.list.push(factory(Fx)); }};
  const PHC = 'Placeholder creature. No ability yet.', PHE = 'Placeholder enchantment. No effect yet.';
  Cards.add(() => ({id:'soldier', name:'Soldier', type:'creature', atk:2, hp:3, text:PHC}));
  Cards.add(() => ({id:'knight',  name:'Knight',  type:'creature', atk:4, hp:5, text:PHC}));
  Cards.add(() => ({id:'giant',   name:'Giant',   type:'creature', atk:6, hp:8, text:PHC}));
  Cards.add(() => ({id:'barrier', name:'Barrier', type:'enchantment', hp:2, text:PHE}));
  Cards.add(Fx => ({id:'ward', name:'Ward', type:'enchantment', hp:4, text:'Fast. You have lost life: sacrifice this card, then gain 3 life. (Stack HP 2)',
    abilities:[{name:'Restore', speed:'Fast', req:[Fx.req.hurt], hp:2, effects:[Fx.gainLife(3), Fx.sacrificeSelf()]}]}));
  Cards.add(() => ({id:'aura', name:'Aura', type:'enchantment', hp:6, text:PHE}));
  Cards.add(Fx => ({id:'heal', name:'Heal', type:'spell', timing:'Quick', hp:3, text:'Quick. Gain 3 life.', effects:[Fx.gainLife(3)]}));
  Cards.add(Fx => ({id:'zap', name:'Zap', type:'spell', timing:'Quick', hp:0, text:'Quick, 0 HP (still resolves). Deal 1 damage to the opponent.', effects:[Fx.dealDamage('player', 1)]}));
  Cards.add(Fx => ({id:'archer', name:'Archer', type:'creature', atk:3, hp:2, text:'Slow. Front row: pay 1 life; deal 2 damage to the opponent. (Stack HP 1)',
    abilities:[{name:'Volley', speed:'Slow', req:[Fx.req.front], cost:[Fx.payLife(1)], hp:1, effects:[Fx.dealDamage('player', 2)]}]}));
  Cards.add(() => ({id:'guard', name:'Guard', type:'creature', atk:1, hp:6, text:PHC}));
  Cards.add(() => ({id:'wolf',  name:'Wolf',  type:'creature', atk:3, hp:3, text:PHC}));
  Cards.add(Fx => ({id:'scout', name:'Scout', type:'creature', atk:1, hp:1, text:'Fast. A creature faces this: sacrifice this card; deal 3 damage to that creature. (Stack HP 0)',
    abilities:[{name:'Ambush', speed:'Fast', req:[Fx.req.target], cost:[Fx.sacrificeSelf()], target:Fx.target.opposingFront, hp:0, effects:[Fx.dealDamage('target', 3)]}]}));
  Cards.add(() => ({id:'banner', name:'Banner', type:'enchantment', hp:3, text:PHE}));
  Cards.add(() => ({id:'trap',   name:'Trap',   type:'enchantment', hp:1, text:PHE}));
  Cards.add(Fx => ({id:'charm', name:'Charm', type:'enchantment', hp:5, text:'Slow. Exile your oldest GY card; draw 1. (Stack HP 1)',
    abilities:[{name:'Recall', speed:'Slow', cost:[Fx.exileFromGY(1)], hp:1, effects:[Fx.draw(1)]}]}));
  Cards.add(Fx => ({id:'bolt', name:'Bolt', type:'spell', timing:'Quick', hp:2, text:'Quick. Deal 3 damage to the stack object beneath it (countered at HP -1 or lower).', effects:[Fx.damageStack(3)]}));
  Cards.add(() => ({id:'mend',     name:'Mend',     type:'spell', timing:'Quick', hp:4, text:'Placeholder Quick spell. No effect yet.'}));
  Cards.add(() => ({id:'fireball', name:'Fireball', type:'spell', timing:'Slow',  hp:6, text:'Placeholder Slow spell. No effect yet.'}));
  Cards.add(() => ({id:'rally',    name:'Rally',    type:'spell', timing:'Slow',  hp:1, text:'Placeholder Slow spell. No effect yet.'}));
  Cards.add(() => ({id:'blast',    name:'Blast',    type:'spell', timing:'Slow',  hp:5, text:'Placeholder Slow spell: only when the stack is empty. No effect yet.'}));
  Cards.add(Fx => ({id:'hummingbird', name:'Red Hummingbird', type:'creature', atk:2, hp:1,
    text:'When this enters: draw a card. When this card or an opponent\u2019s creature attacks: you may shift this card to an adjacent empty column. Fast, from your GY: exile this card; gain 3 life.',
    triggers:[Fx.trigger.enter(Fx.draw(1)), Fx.trigger.attack(['self', 'foe'], Fx.shiftAdjacent())],
    abilities:[{name:'Feather Balm', speed:'Fast', zone:'gy', req:[Fx.req.hurt], cost:[Fx.exileSelf()], hp:1, effects:[Fx.gainLife(3)]}]}));
  Cards.add(Fx => { const spread = Fx.repeat(4, Fx.nearestZone(['self', 'vine-token']), Fx.destroyOnZone(), Fx.createToken('vine'));
    return {id:'vine', name:'The Vine', type:'creature', atk:1, hp:1,
      text:'When this enters and at the start of your turn: 4 times, pick the closest zone not occupied by this card or a Vine token, destroy the card there, and create a Vine token (1/1) on it.',
      tokens:{vine:{id:'vine-token', name:'Vine', type:'creature', atk:1, hp:1, text:'Token. Vanilla 1/1.'}},
      triggers:[Fx.trigger.enter(spread), Fx.trigger.turnStart(spread)]}; });
  const DEFS = Cards.list;


  // =====================================================================
  // SIMULATION: plain serialisable data + pure functions. No THREE, no DOM,
  // no view/camera concepts. Commands in, events out. Runs headless.
  // =====================================================================
  const deepFreeze = o => { if (o && typeof o === 'object' && !Object.isFrozen(o)){ Object.values(o).forEach(deepFreeze); Object.freeze(o); } return o; };
  deepFreeze(DEFS); deepFreeze(TYPES);                // CardDefinitions are immutable design data
  const Sim = (function(){
    const other = p => p === 'Player' ? 'Opponent' : 'Player';
    const isPerm = c => c.def.type !== 'spell' && c.def.type !== 'ability';
    const slotRow = c => c.def.type === 'creature' ? 'front' : 'back';
    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
    function buildDeck(owner, seed, defs){                  // CardInstances, top of deck first
      const rnd = mulberry32(seed);
      const cards = defs.map((def,i) => ({iid: owner.toLowerCase()+'-'+i, def, owner, loc:'deck', slot:null, damage:[]}));
      for (let i = cards.length-1; i > 0; i--){ const j = Math.floor(rnd()*(i+1)); [cards[i],cards[j]] = [cards[j],cards[i]]; }
      return cards;
    }
    function create(n, defs){                         // content is injected: the Sim never reads globals
      const s = {n, phase:'deck', ready:{Player:false, Opponent:false}, cards:{}, piles:{}, slots:{}, stack:[], active:'Player', priority:'Player', passes:0, attackPhase:false, life:{Player:20, Opponent:20}, maxLife:20, attacked:[], turn:1, seq:0, majorUsed:false, sid:0, choice:null, pending:null};
      for (const [p, seed] of [['Player', n*2+1], ['Opponent', n*2]]){
        const deck = buildDeck(p, seed, defs); deck.forEach(c => s.cards[c.iid] = c);
        s.piles[p] = {deck, hand:[], gy:[], exile:[]};   // opening hands are dealt when both players press Start
        for (const row of ['front','back']) for (let c = 0; c < 5; c++) s.slots[p+'|'+row+'|'+c] = null;   // slot -> iid
      }
      return s;
    }
    const freeSlots = (s, c) => Object.keys(s.slots).filter(k => !s.slots[k] && k.startsWith(c.owner+'|'+slotRow(c)+'|'));
    function canPlay(s, c){                           // reason string, or null if legal
      if (s.phase !== 'play') return 'The game has not started';
      if (c.loc !== 'hand') return 'Not in hand';
      if (c.owner !== s.priority) return 'Not this player\u2019s priority';
      if (s.attackPhase && (isPerm(c) || c.def.timing !== 'Quick')) return 'Only Quick spells during the battle phase';
      if ((isPerm(c) || c.def.timing === 'Slow') && c.owner !== s.active) return 'Slow cards: turn player only';
      if ((isPerm(c) || c.def.timing === 'Slow') && majorUsed(s)) return 'Major action already used this turn';
      if (isPerm(c)){
        if (s.stack.length) return 'Only when the stack is empty';
        if (!freeSlots(s, c).length) return 'No free ' + slotRow(c) + ' zone';
      } else if (c.def.timing === 'Slow' && s.stack.length) return 'Slow spells need an empty stack';
      return null;
    }
    const totalDamage = c => c.damage.reduce((n, d) => n + d.amount, 0);
    // ---- Abilities & stack objects ------------------------------------------------
    const RULES = {oneMajor:true};                    // console: cardGame.Sim.RULES.oneMajor = false to sandbox freely
    const majorUsed = s => RULES.oneMajor && s.majorUsed;
// ---- Published effect API. Cards reference these by name through Fx; add an entry here to give every card a new building block.
    const TARGETS = {opposingFront: (s, c) => { const col = c.slot && c.slot.split('|')[2], id = col != null && s.slots[other(c.owner) + '|front|' + col]; return id ? s.cards[id] : null; }};
    const findTarget = (s, c, a) => a.target && TARGETS[a.target] ? TARGETS[a.target](s, c) : null;
    const REQS = {                                    // -> reason string, or null if satisfied

  function labelTexture(title, sub, w, d){
    const c = document.createElement('canvas');
    const S = 128;                              // pixels per world unit
    c.width = Math.round(S*w*0.96); c.height = Math.round(S*d*0.96);
    const g = c.getContext('2d');
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const maxW = c.width * 0.88;
    // shrink font until the text fits inside the zone
    function fit(text, weight, size){
      for (; size > 8; size--){
        g.font = weight + ' ' + size + 'px sans-serif';
        if (g.measureText(text).width <= maxW) break;
      }
      return size;
    }
    const tSize = fit(title, 'bold', 52);
    g.fillStyle = 'rgba(255,255,255,0.92)';
    g.font = 'bold ' + tSize + 'px sans-serif';
    g.fillText(title, c.width/2, sub ? c.height/2 - tSize*0.3 : c.height/2);
    if (sub){
      const sSize = fit(sub, 'normal', Math.round(tSize*0.7));
      g.font = sSize + 'px sans-serif';
      g.fillStyle = 'rgba(255,255,255,0.6)';
      g.fillText(sub, c.width/2, c.height/2 + tSize*0.6);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 8;
    return tex;
  }

  function makeZone(name, label, w, d, color, x, z, sub, rot){
    rot = rot || 0;   // text rotation in radians, seen from above
    const mat = new THREE.MeshStandardMaterial({color, roughness:0.7, emissive:0x000000});
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, d), mat);
    mesh.position.set(x, 0, z);
    mesh.userData = {name, owner: name.startsWith('Player') ? 'Player' : name.startsWith('Opp') ? 'Opponent' : null};
    scene.add(mesh);
    const quarter = Math.abs(rot - Math.PI/2) < 1e-6;
    const tw = quarter ? d : w, td = quarter ? w : d;   // text frame is swapped when turned 90 degrees
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(tw*0.96, td*0.96),
      new THREE.MeshBasicMaterial({map: labelTexture(label, sub, tw, td), transparent:true})
    );
    plane.rotation.x = -Math.PI/2;
    plane.rotation.z = rot;
    plane.position.set(x, 0.065, z);
    scene.add(plane);
    mesh.userData.sub = sub;
    mesh.userData.plane = plane;
    mesh.userData.relabel = s2 => {
      if (s2 === mesh.userData.sub) return;
      mesh.userData.sub = s2;
      plane.material.map.dispose();
      plane.material.map = labelTexture(label, s2, tw, td);
      plane.material.needsUpdate = true;
    };
    zones.push(mesh);
    return mesh;
  }

        m = new THREE.Mesh(cardGeo, mat); cardGroup.add(m); meshes.set(id, m);
        const o = t.c.loc === 'hand' ? sideZones[t.c.owner + 'deck'].position : {x:t.x, z:t.z};   // drawn cards fly out of the deck
        m.position.set(o.x, t.y, o.z); m.userData.by = t.y;
      } else if (m.material !== mat) m.material = mat;
      Object.assign(m.userData, {name: t.down ? 'Face-down card' : t.c.def.name, card: t.down ? null : t.c, tx:t.x, tz:t.z, ty:t.y, owner:t.owner, dying:false});
      setGlow(m, !t.down && canUse(t.c));
      if (!t.down) pickCards.push(m);
    }
    for (const [id, m] of meshes) if (!T.has(id)){    // left the table: glide to its pile, then disappear
      const c = game.cards[id];
      if (c.loc === 'stack' || c.loc === 'gone'){ cardGroup.remove(m); meshes.delete(id); continue; }   // the showcase animation carries it to the stack instead
      const z = sideZones[c.owner + (c.loc === 'gy' ? 'gy' : 'deck')];
      Object.assign(m.userData, {tx:z.position.x, tz:z.position.z, ty:0.11, dying:true, card:null}); setGlow(m, false);
    }
    for (const p of ['Player', 'Opponent']){
      sideZones[p+'deck'].userData.relabel(game.piles[p].deck.length + ' cards');
      sideZones[p+'gy'].userData.relabel(game.piles[p].gy.length + ' cards');
    }
    const held = placing || (drag && drag.card), free = held && isPerm(held) ? new Set(Sim.freeSlots(game, held)) : null;
    const ch = game.choice, chCur = ch ? game.cards[ch.iid].slot : null;   // shift choice: highlight left / right / current zone
    const valid = ch ? zones.filter(z => ch.options.includes(z.userData.slotKey) || z.userData.slotKey === chCur) : !held ? [] : free ? zones.filter(z => free.has(z.userData.slotKey)) : zones.filter(z => z.userData.slot);
    zones.forEach(z => { const cur = ch && z.userData.slotKey === chCur; z.userData.baseEm = valid.includes(z) ? (cur ? 0x7a5c14 : 0x1f6b2f) : 0; z.userData.hoverEm = cur ? 0xc99a2a : 0; applyEm(z); });
    stackEl.classList.toggle('drop', !!(drag && !isPerm(drag.card)));
    statusEl.textContent = game.phase === 'deck' ? deckStatus() : drag ? 'Drop ' + drag.card.def.name + (isPerm(drag.card) ? ' on a highlighted zone' : ' on the board or the stack') :
      game.choice ? NAME[game.choice.player] + ': ' + game.choice.prompt + ' Click a green zone to shift there, or the amber zone to stay.' :
      placing ? 'Placing ' + placing.def.name + ': click a highlighted zone (Esc to cancel)' :
      NAME[game.active] + '\u2019s turn' + (game.attackPhase ? ' (attack phase)' : '') + (game.majorUsed ? ' (major action used)' : '') + ' \u00b7 ' + (ui.note ? ui.note + ' \u00b7 ' : '') + (game.stack.length ? 'Stack (top last): ' + game.stack.map(o => o.name + ' [HP ' + o.hp + ']').join(' \u2192 ') + ' \u00b7 ' : 'Stack empty \u00b7 ') +
      NAME[game.priority] + ' has priority' + (ui.view !== game.priority ? ' (viewing ' + NAME[ui.view] + ')' : '');
    for (const p of ['Player', 'Opponent']){          // life bars
      const row = document.querySelector('#hp [data-p="' + p + '"]'), L = Math.max(0, game.life[p]);
      row.querySelector('i').style.width = (L / game.maxLife * 100) + '%'; row.querySelector('b').textContent = L;
    }
    if (openList) buildList();
    if (selected && selected.loc === 'hand' && selected.owner !== ui.view) selected = null;
    refreshInspect();
    dirty = true; hoverDirty = true;
  }
  function animate(){                                 // returns true while anything is still moving
    let busy = false, gl = 0; pulse = false;
    if (links.length){ busy = true; updateLink(); }
    for (const m of meshes.values()) if (m.userData.glow) gl++;
    if (gl){ pulse = true; glowMat.opacity = 0.3 + 0.7 * Math.pow(0.5 + 0.5 * Math.sin(performance.now() / 1000 * 2.6), 2); }   // pulse only: rendered at ~30 fps below   // periodic pulse
    if (camAngle !== camGoal){
      camAngle += (camGoal - camAngle) * 0.12; if (Math.abs(camGoal - camAngle) < 0.002) camAngle = camGoal;
      const c = Math.cos(camAngle), s = Math.sin(camAngle);
      camera.position.set(3*c + 22*s, 29, -3*s + 22*c);
      controls.target.set(0, 0, 0); busy = true; if (tv.on) placeTop();
    }
    for (const p of ['Player', 'Opponent']){
      const t = p === game.priority ? 0.45 : 0;
      if (lift[p] !== t){ lift[p] += (t - lift[p]) * 0.15; if (Math.abs(t - lift[p]) < 0.002) lift[p] = t; busy = true; }
    }
    for (const p of ['Player', 'Opponent']) pads[p].material.color.lerpColors(GROUND_DIM, GROUND_LIT, lift[p] / 0.45);
    zones.forEach(z => { const L = z.userData.owner ? lift[z.userData.owner] : 0; z.position.y = L; z.userData.plane.position.y = 0.065 + L; });
    for (const [id, m] of meshes){
      if (drag && drag.card.iid === id){ busy = true; continue; }    // follows the pointer
      const u = m.userData, dx = u.tx - m.position.x, dz = u.tz - m.position.z, dy = u.ty - u.by;
      if (Math.abs(dx) + Math.abs(dz) + Math.abs(dy) > 0.003){ m.position.x += dx*0.25; m.position.z += dz*0.25; u.by += dy*0.25; busy = true; }
      else { m.position.x = u.tx; m.position.z = u.tz; u.by = u.ty; if (u.dying){ cardGroup.remove(m); meshes.delete(id); continue; } }
      m.position.y = u.by + (u.owner ? lift[u.owner] : 0);
    }
    return busy;
  }

  // ---- Input: pointer -> commands only ----------------------------------------------
  let pickList = null;                                // cached; rebuilt only after sync()
  const pickables = () => pickList || (pickList = [...pickCards, ...zones]);
  function aim(x, y){ mouse.set(x/innerWidth*2-1, -(y/innerHeight)*2+1); ray.setFromCamera(mouse, cam); }
  function pickAt(x, y, list){ aim(x, y); const h = ray.intersectObjects(list || pickables())[0]; return h ? h.object : null; }
  let downAt = null;
  addEventListener('pointerdown', e => {
    if (e.target !== renderer.domElement){ if (!menu.contains(e.target)) closeMenu(); return; }
    downAt = {x:e.clientX, y:e.clientY};
    const o = pickAt(e.clientX, e.clientY), c = o && o.userData.card;
    dragCand = (c && c.loc === 'hand' && c.owner === ui.view && !uiCanPlay(c)) ? c : null;
    panFrom = tv.on && !dragCand ? {x:e.clientX, y:e.clientY} : null;
    if (dragCand) controls.enabled = false;           // keep the camera still while dragging a card
  }, true);
  addEventListener('pointermove', e => {
    aim(e.clientX, e.clientY); hoverDirty = true;
    if (e.target !== renderer.domElement && !drag) mouse.set(2, 2);   // pointer over a panel: nothing on the board is hovered
    if (panFrom && !drag && e.buttons){
      const k = 2*ortho.top/innerHeight, dx = e.clientX-panFrom.x, dy = e.clientY-panFrom.y, s = Math.sin(camAngle), c = Math.cos(camAngle);
      panFrom = {x:e.clientX, y:e.clientY};
      tv.cx = Math.max(-14, Math.min(14, tv.cx + (-c*dx - s*dy)*k)); tv.cz = Math.max(-14, Math.min(14, tv.cz + (s*dx - c*dy)*k));
      placeTop(); dirty = true;
    }
    if (downAt && !drag && !menu.hidden && Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y) > 6) closeMenu();
    if (dragCand && !drag && downAt && Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y) > 6){
      drag = {card: dragCand}; closeMenu(); sync();
    }
    if (drag){                                        // the card's own mesh follows the pointer just above the table
      const o = ray.ray.origin, d = ray.ray.direction, t = (1.2 - o.y) / d.y;
      meshes.get(drag.card.iid).position.set(o.x + d.x*t, 1.2, o.z + d.z*t); dirty = true;
    }
  });
  function endDrag(e, drop){
    const c = drag.card; drag = null; dragCand = null; controls.enabled = !tv.on;
    if (drop){
      const z = pickAt(e.clientX, e.clientY, zones);
      const onStack = !!(e.target.closest && e.target.closest('#stack'));
      if ((z || onStack) && c.loc === 'hand' && !uiCanPlay(c)){
        if (isPerm(c)){ if (z && z.userData.slot && z.userData.baseEm){ place(c, z); return; } }
        else if (onStack || z.userData.slot){ send({type:'PlayCard', iid:c.iid}); return; }
      }
    }
    sync();
  }
  addEventListener('pointercancel', e => { if (drag) endDrag(e, false); dragCand = null; controls.enabled = !tv.on; });
  addEventListener('pointerup', e => {
    panFrom = null;
    if (drag){ endDrag(e, true); downAt = null; return; }
    dragCand = null; controls.enabled = !tv.on;
    if (!downAt || e.target !== renderer.domElement || Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y) > 6){ downAt = null; return; }
    downAt = null;
    const o = pickAt(e.clientX, e.clientY), u = o ? o.userData : {};
    if (game.choice){                                 // shift choice answered on the board itself
      const k = game.choice, opt = u.slotKey && u.baseEm ? (u.slotKey === game.cards[k.iid].slot ? 'stay' : u.slotKey) : (u.card && u.card.iid === k.iid ? 'stay' : null);
      if (opt && k.options.includes(opt)){ send({type:'Choose', player:k.player, option:opt}); return; }
    }
    if (placing && o && u.slot && u.baseEm){ place(placing, o); return; }
    if (u.card && !placing){ showCard(u.card); openMenu(u.card, e.clientX, e.clientY); }
    else if (u.deckOf && !placing){ closeMenu(); showList(u.deckOf, 'deck'); }
    else if (u.gyOf && !placing){ closeMenu(); showList(u.gyOf, 'gy'); }
    else closeAll();                                  // empty space / plain zone: close every popup
  });
  function updateHover(){
    ray.setFromCamera(mouse, cam);
    const hit = ray.intersectObjects(pickables())[0], m = hit ? hit.object : null;
    if (m === hovered) return;
    const old = hovered; hovered = m; dirty = true; inspHold = false;
    const pc = m && m.userData.card; preview = drag ? null : pc || null; refreshInspect();
    if (pc && !drag) setLink({t:'card', iid:pc.iid}); else if (linkSrc && linkSrc.t === 'card') setLink(null);   // card -> its stack entries
    for (const x of [old, m]) if (x) x.material.emissive && applyEm(x);
    hud.innerHTML = '<b>' + disp(m ? m.userData.name : 'Hover a zone') + '</b>';
    const u = m ? m.userData : {};
    renderer.domElement.style.cursor = (u.deckOf || u.gyOf || u.card || ((placing || game.choice) && u.baseEm)) ? 'pointer' : '';
  }

  renderer.domElement.style.touchAction = 'none';
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); fitOrtho();
    renderer.setSize(innerWidth, innerHeight); dirty = true;
  });
  controls.addEventListener('change', () => { dirty = true; hoverDirty = true; });
  // ---- Headless rules tests (no THREE/DOM): run cardGame.selfTest() in the console ----
  function selfTest(){
    const out = [], check = (name, ok) => out.push((ok ? 'PASS ' : 'FAIL ') + name);
    const start = seed => { const s = Sim.create(seed, DEFS); for (const p of ['Player', 'Opponent']) Sim.dispatch(s, {type:'Start', player:p}); return s; };
    const take = (s, o, id, loc, slot) => {           // move a named card out of its pile into hand or a board slot
      const c = Object.values(s.cards).find(x => x.owner === o && x.def.id === id), P = s.piles[o];
      for (const k of ['deck', 'hand']){ const i = P[k].indexOf(c); if (i >= 0) P[k].splice(i, 1); }
      c.loc = loc; if (loc === 'hand') P.hand.push(c); else if (loc === 'gy') P.gy.push(c); else { s.slots[slot] = c.iid; c.slot = slot; }
      return c;
    };
    check('every card only uses published effect APIs', !apiErrors().length);
    check('same seed -> same state', JSON.stringify(start(7)) === JSON.stringify(start(7)));
    let s = start(1), c = take(s, 'Player', 'knight', 'board', 'Player|front|0'); s.attackPhase = true;
    Sim.dispatch(s, {type:'Attack', iid:c.iid});
    check('empty column hits the player', s.life.Opponent === 16);
    s = start(2); const v = take(s, 'Opponent', 'soldier', 'board', 'Opponent|front|1'); c = take(s, 'Player', 'giant', 'board', 'Player|front|1'); s.attackPhase = true;
    Sim.dispatch(s, {type:'Attack', iid:c.iid});
    check('excess damage tramples to the player', v.loc === 'gy' && s.life.Opponent === 17);
    s = start(3); let z = take(s, 'Player', 'zap', 'hand');
    Sim.dispatch(s, {type:'PlayCard', iid:z.iid}); Sim.dispatch(s, {type:'Pass', player:'Opponent'}); Sim.dispatch(s, {type:'Pass', player:'Player'});
    check('0 HP stack object still resolves', z.loc === 'gy' && s.life.Opponent === 19);
    s = start(4); z = take(s, 'Player', 'zap', 'hand'); const b = take(s, 'Opponent', 'bolt', 'hand');
    Sim.dispatch(s, {type:'PlayCard', iid:z.iid}); Sim.dispatch(s, {type:'PlayCard', iid:b.iid});
    Sim.dispatch(s, {type:'Pass', player:'Player'}); Sim.dispatch(s, {type:'Pass', player:'Opponent'});
    check('stack object at -1 HP is countered', z.loc === 'gy' && s.life.Opponent === 20 && !s.stack.length);
    s = start(5); let h = take(s, 'Player', 'hummingbird', 'hand'); const n0 = s.piles.Player.hand.length;
    Sim.dispatch(s, {type:'PlayCard', iid:h.iid, slot:'Player|front|2'}); Sim.dispatch(s, {type:'Pass', player:'Player'}); Sim.dispatch(s, {type:'Pass', player:'Opponent'});
    check('Hummingbird enter trigger draws a card', s.piles.Player.hand.length === n0 && h.loc === 'board');
    s = start(6); h = take(s, 'Opponent', 'hummingbird', 'board', 'Opponent|front|1'); c = take(s, 'Player', 'giant', 'board', 'Player|front|1'); s.attackPhase = true;
    Sim.dispatch(s, {type:'Attack', iid:c.iid});
    check('attack damage waits for triggers', !!s.pending && s.life.Opponent === 20 && s.stack.length === 1);
    Sim.dispatch(s, {type:'Pass', player:'Player'}); Sim.dispatch(s, {type:'Pass', player:'Opponent'});
    check('shift choice is requested', !!s.choice && s.choice.player === 'Opponent' && s.choice.options.length === 3);
    Sim.dispatch(s, {type:'Choose', player:'Opponent', option:'Opponent|front|0'});
    check('shifted Hummingbird dodges the attack', h.slot === 'Opponent|front|0' && s.life.Opponent === 14 && !s.pending);
    s = start(8); h = take(s, 'Player', 'hummingbird', 'gy'); s.life.Player = 10;
    Sim.dispatch(s, {type:'Activate', iid:h.iid, ab:0}); Sim.dispatch(s, {type:'Pass', player:'Opponent'}); Sim.dispatch(s, {type:'Pass', player:'Player'});
    check('GY ability exiles Hummingbird and gains 3 life', h.loc === 'exile' && s.life.Player === 13);
    const owners = st => st.stack.map(o => st.cards[o.src].owner).join();
    s = start(11); take(s, 'Player', 'hummingbird', 'board', 'Player|front|0'); c = take(s, 'Player', 'soldier', 'board', 'Player|front|2'); take(s, 'Opponent', 'hummingbird', 'board', 'Opponent|front|4'); s.attackPhase = true;
    Sim.dispatch(s, {type:'Attack', iid:c.iid});
    check('trigger matches the card text: own non-attacking creature does not trigger Hummingbird', owners(s) === 'Opponent' && s.priority === 'Player');
    s = start(13); c = take(s, 'Player', 'hummingbird', 'board', 'Player|front|0'); take(s, 'Opponent', 'hummingbird', 'board', 'Opponent|front|3'); s.attackPhase = true;
    Sim.dispatch(s, {type:'Attack', iid:c.iid});
    check('simultaneous triggers: turn player (Player) goes on the stack first, then the other player', owners(s) === 'Player,Opponent' && s.priority === 'Player');
    s = start(14); s.active = 'Opponent'; s.priority = 'Opponent'; take(s, 'Player', 'hummingbird', 'board', 'Player|front|0'); c = take(s, 'Opponent', 'hummingbird', 'board', 'Opponent|front|3'); s.attackPhase = true;
    Sim.dispatch(s, {type:'Attack', iid:c.iid});
    check('simultaneous triggers: turn player (Opponent) goes on the stack first, then the other player', owners(s) === 'Opponent,Player' && s.priority === 'Opponent');
    // ---- The Vine ----
    const toks = st => Object.values(st.cards).filter(x => x.def.id === 'vine-token' && x.loc === 'board');
    s = start(21); const vn = take(s, 'Player', 'vine', 'hand'), sd = take(s, 'Opponent', 'soldier', 'board', 'Opponent|front|2');
    Sim.dispatch(s, {type:'PlayCard', iid:vn.iid, slot:'Player|front|2'}); Sim.dispatch(s, {type:'Pass', player:'Player'}); Sim.dispatch(s, {type:'Pass', player:'Opponent'});
    check('Vine enter: one token on each of the 4 nearest zones (any row)', toks(s).length === 4 && ['Player|front|1', 'Player|front|3', 'Player|back|2', 'Opponent|front|2'].every(k => s.slots[k] && s.cards[s.slots[k]].def.id === 'vine-token'));
    check('Vine destroys the card on the zone it picks; the Vine itself stays', sd.loc === 'gy' && vn.loc === 'board' && vn.slot === 'Player|front|2');
    Sim.dispatch(s, {type:'EndTurn', player:'Player'}); Sim.dispatch(s, {type:'EndTurn', player:'Opponent'});
    check('Vine turn-start trigger goes on the stack only at its controller\u2019s turn start', s.stack.length === 1 && s.active === 'Player');
    Sim.dispatch(s, {type:'Pass', player:'Player'}); Sim.dispatch(s, {type:'Pass', player:'Opponent'});
    check('Vine turn-start: 4 more tokens, never on the Vine or an existing token', toks(s).length === 8 && vn.slot === 'Player|front|2');
    s = start(22); const vn2 = take(s, 'Player', 'vine', 'board', 'Player|front|0');
    for (const k of Object.keys(s.slots)) if (!s.slots[k]) { const t = take(s, 'Opponent', 'soldier', 'board', k); t.owner = 'Opponent'; }
    check('Vine: full board (no legal zone) is handled without error', (() => { try { Sim.dispatch(s, {type:'EndTurn', player:'Player'}); Sim.dispatch(s, {type:'EndTurn', player:'Opponent'}); Sim.dispatch(s, {type:'Pass', player:'Player'}); Sim.dispatch(s, {type:'Pass', player:'Opponent'}); return true; } catch (e) { return false; } })());
    s = start(23); const VT = DEFS.find(d => d.id === 'vine').tokens.vine, vz = take(s, 'Player', 'knight', 'board', 'Player|front|1'), tk = take(s, 'Player', 'soldier', 'board', 'Opponent|front|1');
    tk.def = VT; tk.token = true; s.attackPhase = true; Sim.dispatch(s, {type:'Attack', iid:tk.iid});
    check('token standing on the foe\u2019s front row hits the foe, not its own side', s.life.Opponent === 19 && s.life.Player === 20 && !vz.damage.length);
    s = start(24); const tb = take(s, 'Player', 'soldier', 'board', 'Opponent|front|1'), ob = take(s, 'Opponent', 'knight', 'board', 'Opponent|back|1');
    tb.def = VT; tb.token = true; s.attackPhase = true; Sim.dispatch(s, {type:'Attack', iid:tb.iid});
    check('token on the foe\u2019s front row damages the foe\u2019s back card in its column', ob.damage.length === 1 && s.life.Opponent === 20);
    s = start(25); c = take(s, 'Player', 'knight', 'board', 'Player|back|0'); s.attackPhase = true;
    check('a creature in the back row can attack', Sim.canAttack(s, c) === null);
    Sim.dispatch(s, {type:'Attack', iid:c.iid});
    check('back-row attacker deals damage down its column (empty column hits the player)', s.life.Opponent === 16);
    s = start(26); const av = take(s, 'Player', 'vine', 'board', 'Player|front|1'), ally = take(s, 'Player', 'soldier', 'board', 'Opponent|front|1'); ally.def = VT; ally.token = true; s.attackPhase = true;
    Sim.dispatch(s, {type:'Attack', iid:av.iid});
    check('FEATURE: your Vine on the opponent\u2019s side takes damage from your own Vine attacking down that column', ally.damage.length === 1 && ally.loc === 'board' && s.life.Opponent === 20);
    console.log(out.join('\n')); return out;
  }
  window.cardGame = {Sim, send, undo, eventLog, history, selfTest, get game(){ return sim; }};   // console/testing hook
  setTopView(true);                                   // default camera: top view
  sync();
  (function loop(){                                   // idle = no rendering, no raycasts
    requestAnimationFrame(loop);
    const busy = animate(); controls.update();
    if (hoverDirty && !drag){ hoverDirty = false; updateHover(); }
    const now = performance.now();
    if (busy || dirty || (pulse && now - lastPulse > 33)){ dirty = false; lastPulse = now; renderer.render(scene, cam); }
  })();
})();
</script>

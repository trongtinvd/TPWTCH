<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>3D preview - The Places Where They Call Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Patch10: the standalone 3D card preview (index.html?anim3d comes here). Its own scene: the game is not loaded.
         Patch13: + side view characters (the default cube), the avatars, and an Animation list. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1016;
        color: #f0e2b6;
        font:
          13px system-ui,
          sans-serif;
      }
      #pv {
        display: flex;
        height: 100%;
      }
      #pv-side {
        width: 230px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        box-sizing: border-box;
        background: #161b2a;
        border-right: 1px solid #c9a24a55;
      }
      #pv-side input,
      #pv-side select {
        background: #0e1016;
        color: inherit;
        border: 1px solid #c9a24a88;
        border-radius: 4px;
        padding: 5px;
      }
      #pv-list {
        flex: 1;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #pv-list button,
      #pv-side .b {
        text-align: left;
        background: #1d2741;
        color: inherit;
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 5px 7px;
        cursor: pointer;
      }
      #pv-list .pv-h {
        margin: 8px 0 2px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c9a24a;
      }
      #pv-list button.sel {
        border-color: #f3d27a;
        background: #2b3658;
      }
      #pv-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #pv-view {
        flex: 1;
        min-height: 0;
      }
      #pv-view canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #pv-status {
        padding: 6px 10px;
        background: #161b2a;
        border-top: 1px solid #c9a24a55;
      }
      a {
        color: #f3d27a;
      }
      @media (max-width: 640px) {
        #pv {
          flex-direction: column-reverse;
        }
        #pv-side {
          width: auto;
          height: 40%;
        }
      }
    </style>
  </head>
  <body>
    <div id="pv">
      <div id="pv-side">
        <b>3D preview</b>
        <input id="pv-search" placeholder="Search a card, character, avatar" aria-label="Search" />
        <div id="pv-list" aria-label="Cards"></div>
        <label for="pv-anim">Animation</label>
        <select id="pv-anim" aria-label="Animation"></select>
        <button id="pv-replay" class="b">Play again</button>
        <a href="index.html">Back to the game</a>
      </div>
      <div id="pv-main">
        <div id="pv-view"></div>
        <div id="pv-status">Loading…</div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
    <script src="js/content/cards.js"></script>
    <script src="js/anim/anim-logic.js"></script>
    <script src="js/anim/asset-loader.js"></script>
    <script src="js/anim/procedural.js"></script>
    <script src="js/anim/character.js"></script>
    <script src="js/avatar/avatar-logic.js"></script>
    <script src="js/avatar/avatar-catalog.js"></script>
    <script src="js/avatar/avatar-models.js"></script>
    <script src="js/anim/card-models.js"></script>
    <script src="js/anim/card-preview.js"></script>
  </body>
</html>

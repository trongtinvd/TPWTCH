<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card Game Board Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://github.com/trongtinvd/TPWTCH/blob/main/css/index.css">
</head>
<body>
<div id="hud"><b>Hover a zone</b></div>
<div id="status"></div>
<div id="menu" class="panel" hidden></div>
<div id="pick" class="panel" hidden></div>
<div id="deckPanel" class="panel" hidden></div>
<div id="inspect" class="panel" hidden></div>
<div id="hp">
  <div class="hpr" data-p="Player"><span>Player 1</span><div class="bar"><i></i></div><b>20</b></div>
  <div class="hpr" data-p="Opponent"><span>Player 2</span><div class="bar"><i></i></div><b>20</b></div>
</div>
<div id="stack"></div><button id="viewBtn" class="abtn">Top view</button><div id="help"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://github.com/trongtinvd/TPWTCH/blob/main/js/scene.js">			// scene.js - Three.js scene, camera, renderer, lights, table</script>
<script src="https://github.com/trongtinvd/TPWTCH/blob/main/js/cards.js">			// cards.js - Effect API (Fx) and card definitions</script>
<script src="https://github.com/trongtinvd/TPWTCH/blob/main/js/sim.js">			// sim.js - Simulation: rules, stack, combat, effects, API validation (no THREE, no DOM)</script>
<script src="https://github.com/trongtinvd/TPWTCH/blob/main/js/board.js">			// board.js - Board geometry: zones, side zones, hands, DOM references</script>
<script src="https://github.com/trongtinvd/TPWTCH/blob/main/js/game-host.js">		// game-host.js - Game host and UI state: send(), automation, camera views, function buttons</script>
<script src="https://github.com/trongtinvd/TPWTCH/blob/main/js/card-view.js">		// card-view.js - Card meshes, 3D artwork, card materials, glow</script>
<script src="https://github.com/trongtinvd/TPWTCH/blob/main/js/panels.js">			// panels.js - Deck/graveyard/exile lists, inspect panel, action menu</script>
<script src="https://github.com/trongtinvd/TPWTCH/blob/main/js/view-sync.js">		// view-sync.js - View sync (game state to meshes), hover links and arrows, showcase animations, stack panel</script>
<script src="https://github.com/trongtinvd/TPWTCH/blob/main/js/input.js">			// input.js - Pointer input: drag, click, hover (commands only)</script>
<script src="https://github.com/trongtinvd/TPWTCH/blob/main/js/tests-main.js">		// tests-main.js - Headless self-tests, console hook, bootstrap and render loop</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card Game Board Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hud"><b>Hover a zone</b></div>
<div id="status"></div>
<div id="menu" class="panel" hidden></div>
<div id="deckPanel" class="panel" hidden></div>
<div id="inspect" class="panel" hidden></div>
<div id="hp">
  <div class="hpr" data-p="Player"><span>Player 1</span><div class="bar"><i></i></div><b>20</b></div>
  <div class="hpr" data-p="Opponent"><span>Player 2</span><div class="bar"><i></i></div><b>20</b></div>
</div>
<div id="stack"></div><button id="viewBtn" class="abtn">Top view</button><div id="help"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/scene.js"></script>
<script src="js/cards.js"></script>
<script src="js/sim.js"></script>
<script src="js/board.js"></script>
<script src="js/host.js"></script>
<script src="js/card-visuals.js"></script>
<script src="js/panels.js"></script>
<script src="js/view-sync.js"></script>
<script src="js/links.js"></script>
<script src="js/animations.js"></script>
<script src="js/sync.js"></script>
<script src="js/input.js"></script>
<script src="js/tests.js"></script>
<script src="js/main.js"></script>
</body>
</html>
